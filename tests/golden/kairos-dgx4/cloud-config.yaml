#cloud-config
install:
  auto: true
  poweroff: true
stylus:
  site:
    paletteEndpoint: api.spectrocloud.com
    edgeHostToken: ""
    projectUid: FIXTURE-PROJECT-UID
    tags:
      palette.ai: "true"
      palette.ai/control-plane: "true"
    # Primary kairos password path. Applied by the early user-sync stage, so it
    # does not depend on any boot stage completing.
    users:
      kairos:
        username: kairos
        passwd: $6$k4ir0s0112345678$ITJF/ShuOumrIp1XTVVrCluFuVdrc8lgjFN7wP0j2KD6qhPtzCNai5cQzlPAZj4HoTRqlYYx631zZKM8CqPE90
        homedir: /home/kairos
        groups:
        - admin
        password_expiry: ""

  vip:
    skip: true

# lock_passwd: false only stops cloud-init locking the account; the password
# itself comes from stylus.site.users above.
users:
  - name: kairos
    shell: /bin/bash
    groups: [sudo, admin, adm, systemd-journal]
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: false
stages:
  initramfs:
    - name: "Write Palette admin creds for pre-registration cleanup"
      files:
        - path: /oem/palette-admin.env
          content: |
            APIKEY=FIXTURE-PALETTE-API-KEY
            PROJECTUID=FIXTURE-PROJECT-UID
            ENDPOINT=api.spectrocloud.com
          permissions: 0600
          owner: 0
          group: 0
    # kairos_no_address_ifaces: an interface with no static config falls through
    # to 20-dhcp-legacy.network; on the DGX lab the DHCP server hands eth2 the
    # same address as eth1, and two NICs answering ARP for it flaps the MAC that
    # BCM derives NODE_NAME from. 05- sorts before 20-.
    - name: "Pin eth2 to no address so DHCP cannot duplicate the node IP"
      files:
        - path: /etc/systemd/network/05-eth2.network
          content: |
            [Match]
            Name=eth2

            [Network]
            DHCP=no
            LinkLocalAddressing=no
          permissions: 0644
          owner: 0
          group: 0
  boot:
    # /etc/shadow is rebuilt on every boot, so the hash must be re-asserted here.
    - name: "Re-assert the kairos password hash on the ephemeral /etc"
      commands:
        - usermod -p '$6$k4ir0s0112345678$ITJF/ShuOumrIp1XTVVrCluFuVdrc8lgjFN7wP0j2KD6qhPtzCNai5cQzlPAZj4HoTRqlYYx631zZKM8CqPE90' kairos || useradd -p '$6$k4ir0s0112345678$ITJF/ShuOumrIp1XTVVrCluFuVdrc8lgjFN7wP0j2KD6qhPtzCNai5cQzlPAZj4HoTRqlYYx631zZKM8CqPE90' -m -s /bin/bash -G admin kairos
    - name: "Enable SSH password auth + disable fail2ban"
      files:
        - path: /etc/ssh/sshd_config.d/99-kairos-test.conf
          content: |
            PasswordAuthentication yes
            PermitRootLogin yes
          permissions: 0644
      commands:
        - systemctl restart sshd || systemctl restart ssh || true
        - systemctl disable --now fail2ban 2>/dev/null || true
    - name: "mdraid: pin rd.auto on the kernel line via the OEM grubenv"
      commands:
        - |
          # grub loads /grubenv from COS_OEM and appends ${extra_active_cmdline}
          # to the kernel line (see the /cos menuentry in COS_STATE's grub.cfg),
          # so rd.auto=1 reaches the kernel even when the image's own
          # /etc/cos/bootargs.cfg is replaced -- notably by a Palette
          # provider-image upgrade, the day-2 path that does NOT get the raw's
          # bootargs patch. Without rd.auto=1 dracut never assembles the OS
          # mirror, the twin COS_* labels resolve against raw members, and the
          # node boots split-brain. COS_OEM survives an in-place upgrade, so
          # this persists across one; a dd re-image wipes it, and it is then
          # re-applied here from the artifact.
          if [ -f /oem/grubenv ] && command -v grub2-editenv > /dev/null 2>&1; then
            grub2-editenv /oem/grubenv set extra_active_cmdline="rd.auto=1 net.ifnames=0 biosdevname=0"
          fi
    - name: "Install BCM SSH key"
      files:
        - path: /var/lib/bcm/bcm-key
          content: |
            FIXTURE-BCM-SSH-PRIVATE-KEY
          permissions: 0600
          owner: 0
          group: 0
    - name: "BCM integration: set NOSYNC + start cmd"
      commands:
        - |
          # Interface-agnostic network gate. BCM's category sets net.ifnames=0,
          # but the installed Kairos cmdline is sourced from the image's own
          # bootargs.cfg and may not carry it, so eth0 need not exist at all.
          # Resolve the egress interface for the BCM host instead of naming one.
          for i in $(seq 1 60); do
            BCM_IF=$(ip route get 192.168.98.2 2>/dev/null | awk '{for(j=1;j<=NF;j++) if($j=="dev"){print $(j+1); exit}}')
            [ -n "${BCM_IF}" ] && \
              ip -4 addr show "${BCM_IF}" 2>/dev/null | grep -q "inet " && \
              ping -c1 -W2 192.168.98.2 >/dev/null 2>&1 && break
            sleep 5
          done
          ping -c1 -W2 192.168.98.2 >/dev/null 2>&1 || exit 0
          NODE_MAC=$(ip route get 1 2>/dev/null | awk '{for(i=1;i<=NF;i++) if($i=="dev") print $(i+1); exit}' | xargs -I{} ip link show {} 2>/dev/null | awk '/ether/{print $2}')
          # BCM keys each device on the MAC of the NIC it provisioned through,
          # which need not be the default-route NIC -- and a DGX answers on the
          # same address across ports, so the MAC that routes is often not the
          # MAC BCM holds. Fetch the device list once, match every local MAC,
          # then the routed IP, and fall back to the hostname only last. That
          # fallback is the failure mode that matters: `cmsh device use
          # edge-<uuid>` cannot find the device, so the NOSYNC disarm below
          # silently never commits and the node stays armed for reinstall.
          BCM_DEVLIST=$(ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=10 -o LogLevel=ERROR -i /var/lib/bcm/bcm-key \
              root@192.168.98.2 \
              "echo -e 'device\nlist' | cmsh 2>/dev/null" 2>/dev/null)
          export NODE_NAME=""
          for _mac in $(cat /sys/class/net/*/address 2>/dev/null | tr 'A-Z' 'a-z'); do
            [ "${_mac}" = "00:00:00:00:00:00" ] && continue
            NODE_NAME=$(printf '%s\n' "${BCM_DEVLIST}" | awk -v m="${_mac}" 'tolower($3)==m {print $2; exit}')
            [ -n "${NODE_NAME}" ] && break
          done
          if [ -z "${NODE_NAME}" ]; then
            _ip=$(ip route get 1 2>/dev/null | awk '{for(i=1;i<=NF;i++) if($i=="src"){print $(i+1); exit}}')
            NODE_NAME=$(printf '%s\n' "${BCM_DEVLIST}" | awk -v ip="${_ip}" '$5==ip {print $2; exit}')
          fi
          [ -z "${NODE_NAME}" ] && NODE_NAME=$(hostname)
          export NODE_NAME
          # Never written to the hostname: the node's identity is the Palette edge-host id, not NODE_NAME.
          # Push BCM-derived labels to the Palette edge-host record via admin
          # API. Stylus's own cloud-config merge doesn't pick up /oem/*.yaml
          # files written from stages.boot (kairos-agent's initramfs merge
          # already snapshotted /run/stylus/userdata before this stage ran),
          # so direct API write is the only way to surface dynamic tags.
          # metadata.name stays as the SMBIOS-UID-derived edge-* name (locked
          # by Palette to track the host across re-deploys); friendly
          # identifiers go in metadata.labels.
          SERVICE_TAG=$(dmidecode -s system-serial-number 2>/dev/null | tr -d '[:space:]')
          BCM_CATEGORY=$(ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=10 -i /var/lib/bcm/bcm-key \
              root@192.168.98.2 \
              "cmsh -c 'device; use ${NODE_NAME}; get category' 2>/dev/null" \
              2>/dev/null | grep -oE '^[a-zA-Z0-9_.-]+$' | tail -1)
          SMBIOS_UUID=$(cat /sys/class/dmi/id/product_uuid 2>/dev/null | tr -d '-' | tr 'A-Z' 'a-z')
          EDGE_UID="edge-${SMBIOS_UUID}"
          # Wait for stylus to finish first-boot registration (the edge-host
          # record needs to exist in Palette before we PUT labels onto it).
          # Then send the PUT in the background (don't block the boot stage).
          if [ -r /oem/palette-admin.env ]; then
            (
              # shellcheck disable=SC1091
              . /oem/palette-admin.env
              for i in $(seq 1 60); do
                code=$(curl -sk -m 15 -H "ApiKey: ${APIKEY}" -H "ProjectUid: ${PROJECTUID}" \
                    -o /dev/null -w "%{http_code}" \
                    "https://${ENDPOINT}/v1/edgehosts/${EDGE_UID}")
                [ "$code" = "200" ] && break
                sleep 10
              done
              [ "$code" = "200" ] || exit 0
              body=$(printf '{"uid":"%s","metadata":{"uid":"%s","name":"%s","labels":{"palette.ai":"true","palette.ai/control-plane":"true","hostname":"%s","bcm-device":"%s","bcm-category":"%s","bcm-mac":"%s","service-tag":"%s"}}}' \
                  "$EDGE_UID" "$EDGE_UID" "$EDGE_UID" \
                  "$NODE_NAME" "$NODE_NAME" "${BCM_CATEGORY:-unknown}" "$NODE_MAC" "${SERVICE_TAG:-unknown}")
              curl -sk -m 30 -X PUT \
                  -H "ApiKey: ${APIKEY}" -H "ProjectUid: ${PROJECTUID}" \
                  -H "Content-Type: application/json" \
                  -d "$body" \
                  "https://${ENDPOINT}/v1/edgehosts/${EDGE_UID}/meta" >/dev/null 2>&1 || true
            ) </dev/null >/dev/null 2>&1 &
            disown
          fi
          BCM_ROOT_PUBKEY=$(ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=10 -i /var/lib/bcm/bcm-key \
              root@192.168.98.2 'cat /root/.ssh/id_ecdsa.pub' 2>/dev/null)
          if [ -n "${BCM_ROOT_PUBKEY}" ]; then
            mkdir -p /root/.ssh
            grep -qF "${BCM_ROOT_PUBKEY}" /root/.ssh/authorized_keys 2>/dev/null || \
              echo "${BCM_ROOT_PUBKEY}" >> /root/.ssh/authorized_keys
            chmod 600 /root/.ssh/authorized_keys
          fi
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=10 -i /var/lib/bcm/bcm-key \
              root@192.168.98.2 \
              "echo -e 'device\nuse ${NODE_NAME}\nset installmode NOSYNC\ncommit' | cmsh" \
              >/dev/null 2>&1 || true
          mkdir -p /var/lib/cm/rootfs
          for attempt in $(seq 1 60); do
            mount -t nfs -o ro,nolock,vers=3 192.168.98.2:/cm/images/default-image /var/lib/cm/rootfs 2>/dev/null && break
            sleep 10
          done
          mountpoint -q /var/lib/cm/rootfs || exit 0
          mkdir -p /var/lib/cm/cmd-etc
          cp -a /var/lib/cm/rootfs/cm/local/apps/cmd/etc/. /var/lib/cm/cmd-etc/ 2>/dev/null || true
          sed -i "s/Master = master/Master = 192.168.98.2/" /var/lib/cm/cmd-etc/cmd.conf
          NODE_MAC=$(ip route get 1 2>/dev/null | awk '{for(i=1;i<=NF;i++) if($i=="dev") print $(i+1); exit}' | xargs -I{} ip link show {} 2>/dev/null | awk '/ether/{print $2}' | tr ':' '-')
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -i /var/lib/bcm/bcm-key \
              root@192.168.98.2:/cm/node-installer/certificates/${NODE_MAC}/cert \
              /var/lib/cm/cmd-etc/cert.pem 2>/dev/null || true
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -i /var/lib/bcm/bcm-key \
              root@192.168.98.2:/cm/node-installer/certificates/${NODE_MAC}/key \
              /var/lib/cm/cmd-etc/cert.key 2>/dev/null || true
          # cmd reports the KERNEL hostname to the head node, and BCM renames the
          # device to whatever it reports. The system hostname stays the Palette
          # edge-host id (kubelet's node identity is bound to it), so give cmd its
          # own UTS namespace carrying the BCM device name instead: without this
          # the node renames its own BCM device to edge-<uuid>, and every later
          # `device use <name>` (deploy-dd, the NOSYNC disarm, validate) misses.
          nohup unshare --mount --uts --fork /bin/bash -c "
            hostname ${NODE_NAME} 2>/dev/null || echo ${NODE_NAME} > /proc/sys/kernel/hostname
            mount --bind /var/lib/cm/cmd-etc /var/lib/cm/rootfs/cm/local/apps/cmd/etc
            mount -t proc proc /var/lib/cm/rootfs/proc 2>/dev/null || true
            mount -t sysfs sysfs /var/lib/cm/rootfs/sys 2>/dev/null || true
            mount -t tmpfs tmpfs /var/lib/cm/rootfs/tmp 2>/dev/null || true
            mount -t tmpfs tmpfs /var/lib/cm/rootfs/var/run 2>/dev/null || true
            mount -t tmpfs tmpfs /var/lib/cm/rootfs/var/spool/cmd 2>/dev/null || true
            cp /etc/resolv.conf /var/lib/cm/rootfs/tmp/resolv.conf 2>/dev/null || true
            mount --bind /var/lib/cm/rootfs/tmp/resolv.conf /var/lib/cm/rootfs/etc/resolv.conf 2>/dev/null || true
            echo ${NODE_NAME} > /var/lib/cm/rootfs/tmp/hostname 2>/dev/null || true
            mount --bind /var/lib/cm/rootfs/tmp/hostname /var/lib/cm/rootfs/etc/hostname 2>/dev/null || true
            exec chroot /var/lib/cm/rootfs /bin/bash -c '
              export HOSTNAME=\$(cat /etc/hostname)
              /cm/local/apps/cmd/sbin/cmd -s -n
            '
          " </dev/null >/dev/null 2>&1 &
          disown
