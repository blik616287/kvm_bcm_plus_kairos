---
# palette-edge-credentials.yml — mint the API key + project uid a Kairos edge
# node needs to register with the self-hosted appliance.
#
#   make palette-edge-credentials
#
# Run after `make palette-appliance` has created the tenant. Writes both values
# into .run-credentials.yml (0600), where the edge build picks them up:
#
#   make kairos-build ANSIBLE_ARGS="-e @profiles/edge-to-appliance.yml"
#
# Read-only against BCM; the only state it creates is a Palette API key.

- name: "Palette: mint edge registration credentials"
  hosts: localhost
  gather_facts: false
  vars:
    e2e_dir: "{{ lookup('env', 'E2E_DIR') | default(playbook_dir + '/..', true) }}"
    appliance_vip_url: "https://{{ appliance_vip }}"
    # Empty = first project in the tenant (the default project).
    edge_palette_project_name: ""
    edge_palette_api_key_name: "bcm-edge-registration"
    edge_palette_api_key_expiry: "2030-01-01"

  pre_tasks:
    - name: Register the BCM as a managed host
      ansible.builtin.import_tasks: tasks/add_bcm_host.yml

    - name: Capture the invoking user (keep .run-credentials.yml user-owned)
      ansible.builtin.command: whoami
      become: false
      changed_when: false
      register: edge_credentials_whoami

    - name: Name the invoking user
      ansible.builtin.set_fact:
        edge_credentials_invoker: "{{ edge_credentials_whoami.stdout }}"

    - name: Load the credentials the appliance run persisted
      ansible.builtin.include_vars:
        file: "{{ e2e_dir }}/.run-credentials.yml"
        name: edge_prior_creds
      no_log: true

    - name: Resolve the tenant admin from them
      ansible.builtin.set_fact:
        appliance_tenant_admin_email: "{{ edge_prior_creds.tenant_admin_email }}"
        appliance_tenant_admin_password: "{{ edge_prior_creds.tenant_admin_password }}"
      no_log: true

  tasks:
    - name: Mint the edge registration credentials
      ansible.builtin.import_tasks: tasks/edge_credentials.yml
