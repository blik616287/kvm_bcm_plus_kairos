---
# appliance_credentials.yml — resolve the Palette appliance's admin credentials
# and the SHA-512 hash that gets baked into the image's cloud-config.
#
# Imported by any entry point that builds or configures the appliance, because
# the credentials must be IDENTICAL across invocations: roles/kairos_build
# bakes a *hash* of appliance_admin_password into the image via
# appliance-cloud-config.yaml.j2, so a freshly generated password on a later
# stage would install an appliance nobody can log into (the Local UI answers
# and every login 401s, with the original password gone).
#
# Precedence: inventory/-e  >  persisted in .run-credentials.yml  >  generated.

# Artifact discovery lives here too, not only in the cluster play: the IMAGE
# build needs appliance_signing_public_key to bake the content-signing key in
# (kairos_edge_custom_config), and stage 3 imports this file. Without it the
# lookup gets an empty path and the appliance later rejects the signed bundle
# with "public key to verify content not found".
# Pull anything the profile names but artifacts/ does not have yet. A no-op
# when the files are already there, so re-runs cost nothing; skipped entirely
# when no filenames are pinned, which is the hand-copied case artifacts/
# README.md describes.
- name: Fetch the licensed artifacts from JFrog when they are missing
  ansible.builtin.import_tasks: appliance_fetch_artifacts.yml
  when:
    - appliance_jfrog_files | default([]) | select | list | length > 0
    - appliance_jfrog_token | default('') | length > 0

- name: Discover the licensed artifacts
  ansible.builtin.set_fact:
    appliance_content_bundle: >-
      {{ appliance_content_bundle if appliance_content_bundle | default('') | length > 0
         else (lookup('ansible.builtin.fileglob', appliance_artifacts_dir ~ '/*.tar.zst', wantlist=True) | sort | last | default('')) }}
    appliance_content_bundle_signature: >-
      {{ appliance_content_bundle_signature if appliance_content_bundle_signature | default('') | length > 0
         else (lookup('ansible.builtin.fileglob', appliance_artifacts_dir ~ '/*.sig.bin', wantlist=True) | sort | last | default('')) }}
    appliance_signing_public_key: >-
      {{ appliance_signing_public_key if appliance_signing_public_key | default('') | length > 0
         else (lookup('ansible.builtin.fileglob', appliance_artifacts_dir ~ '/*.pem', wantlist=True) | sort | last | default('')) }}

# Auto-discovery is only safe with ONE bundle present: fileglob|sort is
# lexicographic, not version-aware, so 4.9.3 sorts above 4.11.0 and the wrong
# bundle gets picked silently. A multi-version setup must pin the bundle in its
# profile; fail loudly rather than build against the wrong one.
- name: Refuse ambiguous artifact discovery
  vars:
    _bundles: "{{ lookup('ansible.builtin.fileglob', appliance_artifacts_dir ~ '/*.tar.zst', wantlist=True) }}"
    _keys: "{{ lookup('ansible.builtin.fileglob', appliance_artifacts_dir ~ '/*.pem', wantlist=True) }}"
  ansible.builtin.assert:
    that:
      - appliance_content_bundle | default('') | length > 0 or _bundles | length < 2
      - appliance_signing_public_key | default('') | length > 0 or _keys | length < 2
    fail_msg: >-
      More than one artifact of the same kind in {{ appliance_artifacts_dir }}
      ({{ _bundles | map('basename') | join(', ') }}{{ ' | ' ~ (_keys | map('basename') | join(', ')) if _keys | length > 1 else '' }}).
      Discovery sorts lexicographically, so 4.9.3 would beat 4.11.0. Pin
      appliance_content_bundle (and appliance_signing_public_key) in your
      profile — see profiles/palette-appliance.yml.

- name: Look for credentials persisted by an earlier invocation
  ansible.builtin.stat:
    path: "{{ e2e_dir }}/.run-credentials.yml"
  register: appliance_creds_stat

- name: Load credentials persisted by an earlier invocation
  ansible.builtin.include_vars:
    file: "{{ e2e_dir }}/.run-credentials.yml"
    name: appliance_prior_creds
  when: appliance_creds_stat.stat.exists
  no_log: true

# appliance_pe_version must be the bundle's STYLUS AGENT version, which is NOT
# the bundle filename: palette-enterprise-appliance-4.10.17.tar.zst ships
# stylus v4.10.4. A mismatch does not fail the build — it surfaces much later
# as a broken cluster deploy — so check it against the bundle itself.
- name: Read the stylus agent version out of the content bundle
  ansible.builtin.script:
    cmd: "bundle_stylus_version.py '{{ appliance_content_bundle }}'"
    executable: python3
  become: false
  register: appliance_bundle_stylus
  changed_when: false
  failed_when: false

- name: Verify appliance_pe_version matches the bundle
  ansible.builtin.assert:
    that: (appliance_bundle_stylus.stdout | trim) in ['', appliance_pe_version]
    fail_msg: >-
      appliance_pe_version is {{ appliance_pe_version }} but
      {{ appliance_content_bundle | basename }} ships stylus
      {{ appliance_bundle_stylus.stdout | trim }}. Set appliance_pe_version to
      the stylus version — the bundle FILENAME is a different number.
    success_msg: >-
      appliance_pe_version {{ appliance_pe_version }} matches the bundle
      {{ '(' ~ (appliance_bundle_stylus.stdout | trim) ~ ')' if appliance_bundle_stylus.stdout | trim else '(unverified)' }}

- name: Capture the invoking user (ansible.cfg become=true → keep run state user-owned)
  ansible.builtin.command: whoami
  become: false
  changed_when: false
  register: appliance_cred_invoker

- name: Resolve the appliance admin password (inventory > persisted > generated)
  ansible.builtin.set_fact:
    appliance_admin_password: >-
      {{ appliance_admin_password if appliance_admin_password | default('') | length > 0
         else (appliance_prior_creds | default({}, true)).appliance_admin_password
              | default(lookup('ansible.builtin.password', '/dev/null length=20 chars=ascii_letters,digits'), true) }}
  no_log: true

- name: Resolve the tenant admin password (inventory > persisted > generated)
  ansible.builtin.set_fact:
    appliance_tenant_admin_password: >-
      {{ appliance_tenant_admin_password if appliance_tenant_admin_password | default('') | length > 0
         else (appliance_prior_creds | default({}, true)).appliance_tenant_admin_password
              | default(lookup('ansible.builtin.password', '/dev/null length=20 chars=ascii_letters,digits') ~ 'Aa1!', true) }}
  no_log: true

- name: Hash the appliance admin password
  # openssl rather than the password_hash filter, which needs passlib (absent
  # on the reference build host). Deterministic salt keeps repeat renders of
  # the cloud-config byte-identical, so the ISO/raw-disk caches are not
  # invalidated by a rebuild that changed nothing.
  ansible.builtin.command:
    argv:
      - openssl
      - passwd
      - -6
      - -salt
      - "{{ (appliance_admin_user ~ 'canvos') | hash('md5') | truncate(16, true, '') }}"
      - "{{ appliance_admin_password }}"
  register: appliance_admin_pw
  changed_when: false
  check_mode: false
  no_log: true

- name: Store the password hash
  ansible.builtin.set_fact:
    appliance_admin_password_hash: "{{ appliance_admin_pw.stdout | trim }}"
  no_log: true

- name: Persist the credentials for later invocations
  # blockinfile, not copy: palette_cluster and palette_tenant append their own
  # marked blocks to this file and a copy would clobber them.
  ansible.builtin.blockinfile:
    path: "{{ e2e_dir }}/.run-credentials.yml"
    create: true
    mode: "0600"
    owner: "{{ appliance_cred_invoker.stdout }}"
    group: "{{ appliance_cred_invoker.stdout }}"
    marker: "# {mark} appliance"
    block: |
      # Written by playbooks/tasks/appliance_credentials.yml; gitignored.
      # Re-read on later invocations — deleting this after the image is built
      # strands the appliance, whose password hash is baked into the image.
      appliance_admin_user: {{ appliance_admin_user }}
      appliance_admin_password: {{ appliance_admin_password }}
      appliance_tenant_admin_password: {{ appliance_tenant_admin_password }}
  no_log: true
