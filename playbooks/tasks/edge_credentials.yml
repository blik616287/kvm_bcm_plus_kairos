---
# edge_credentials.yml — mint what a Kairos edge node needs to register with the
# SELF-HOSTED appliance, from the tenant palette_tenant just created.
#
# The node's registration path is unchanged from a SaaS build: cloud-config
# writes /oem/palette-admin.env (APIKEY/PROJECTUID/ENDPOINT) and
# palette-cleanup-stale.sh mints an edge-host token on first boot via
# POST /v1/edgehosts/tokens. Only the endpoint differs. So all this has to
# produce is a tenant-scoped API key and a project uid.
#
# Everything runs delegate_to: bcm — the build host cannot route to the VIP.
#
# The API key is a credential: it is recorded to .run-credentials.yml (0600,
# gitignored) alongside the passwords, never echoed.

- name: Log in as the tenant admin
  # checkov:skip=CKV_ANSIBLE_1:Appliance serves a self-signed cert on a private VIP.
  ansible.builtin.uri:
    url: "{{ appliance_vip_url }}/v1/auth/authenticate"
    method: POST
    validate_certs: false
    body_format: json
    body:
      emailId: "{{ appliance_tenant_admin_email }}"
      password: "{{ appliance_tenant_admin_password }}"
    status_code: [200]
  delegate_to: bcm
  register: edge_tenant_login
  retries: 20
  delay: 15
  until: edge_tenant_login.status == 200
  no_log: true

- name: Resolve the tenant's projects
  # POST, not GET, and /v1/dashboard/projects, not /v1/projects: the latter is
  # the project CREATE endpoint and answers a GET with
  # "method GET is not allowed, but [POST] are". Verified against a live
  # appliance rather than assumed.
  # checkov:skip=CKV_ANSIBLE_1:Appliance serves a self-signed cert on a private VIP.
  ansible.builtin.uri:
    url: "{{ appliance_vip_url }}/v1/dashboard/projects"
    method: POST
    validate_certs: false
    headers:
      Authorization: "{{ edge_tenant_login.json.Authorization }}"
    body_format: json
    body: {}
    status_code: [200]
  delegate_to: bcm
  register: edge_projects

- name: Pick the project to register edge hosts into
  # Default project unless a name is pinned. Failing loudly here beats handing
  # the node an empty PROJECTUID, which it would only report as a registration
  # failure much later, on the node's own console.
  # json['items'], not json.items: the latter resolves to the Python dict's
  # items() method and fails with "'method' object is not iterable".
  ansible.builtin.set_fact:
    edge_palette_project_uid: >-
      {{ (edge_projects.json['items']
          | selectattr('metadata.name', 'equalto', edge_palette_project_name)
          | map(attribute='metadata.uid') | first)
         if edge_palette_project_name | default('') | length > 0
         else (edge_projects.json['items'] | map(attribute='metadata.uid') | first) }}
    edge_palette_project_label: >-
      {{ edge_projects.json['items'] | map(attribute='metadata.name') | first }}

- name: Refuse to continue without a project
  ansible.builtin.assert:
    that: edge_palette_project_uid | default('') | length > 0
    fail_msg: >-
      No project found in the tenant. The node needs a PROJECTUID to register;
      without one palette-cleanup-stale.sh logs "admin config missing" and the
      host never appears in Palette.

- name: Resolve the calling user's uid
  # The authenticate response carries only Authorization and isMfa, so the uid
  # the apiKeys create needs has to come from here.
  # checkov:skip=CKV_ANSIBLE_1:Appliance serves a self-signed cert on a private VIP.
  ansible.builtin.uri:
    url: "{{ appliance_vip_url }}/v1/users/me"
    method: GET
    validate_certs: false
    headers:
      Authorization: "{{ edge_tenant_login.json.Authorization }}"
    status_code: [200]
  delegate_to: bcm
  register: edge_me

- name: Mint a tenant-scoped API key for edge registration
  # Needs edgeToken.create (mint the registration token) and edgehost.delete
  # (clear a stale record on re-deploy) — see palette-cleanup-stale.sh.
  # checkov:skip=CKV_ANSIBLE_1:Appliance serves a self-signed cert on a private VIP.
  ansible.builtin.uri:
    url: "{{ appliance_vip_url }}/v1/apiKeys"
    method: POST
    validate_certs: false
    headers:
      Authorization: "{{ edge_tenant_login.json.Authorization }}"
    body_format: json
    body:
      metadata:
        name: "{{ edge_palette_api_key_name }}"
      spec:
        expiry: "{{ edge_palette_api_key_expiry }}"
        userUid: "{{ edge_me.json.metadata.uid }}"
    status_code: [200, 201]
  delegate_to: bcm
  register: edge_apikey_create
  no_log: true

- name: Keep the API key for the edge build
  ansible.builtin.set_fact:
    edge_palette_api_key: "{{ edge_apikey_create.json.apiKey }}"
  no_log: true

- name: Record the edge registration credentials
  ansible.builtin.blockinfile:
    path: "{{ e2e_dir }}/.run-credentials.yml"
    create: true
    mode: "0600"
    owner: "{{ edge_credentials_invoker }}"
    group: "{{ edge_credentials_invoker }}"
    marker: "# {mark} edge registration"
    block: |
      edge_palette_project_uid: {{ edge_palette_project_uid }}
      edge_palette_api_key: {{ edge_palette_api_key }}
  no_log: true

- name: Report what the edge build will use
  ansible.builtin.debug:
    msg:
      - "Edge nodes will register to https://{{ appliance_vip }}"
      - "  project uid: {{ edge_palette_project_uid }}"
      - "  api key:     recorded in .run-credentials.yml (0600)"
