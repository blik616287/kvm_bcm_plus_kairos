---
# category.yml — [6/7] configure the {{ kairos_profile }} category: clone it from
# the source category, point it at the installer image in FULL install mode, and
# scope out the health checks that don't fit an immutable-OS compute node.
# Individual cmsh ops are best-effort; the load-bearing end-state (category ->
# installer image) is asserted in ramdisk.yml.

- name: Detect the installer image's kernel version
  ansible.builtin.shell: ls "{{ dd_image_root }}/boot/vmlinuz-"* 2>/dev/null | head -1 | sed 's|.*/vmlinuz-||'
  delegate_to: bcm
  register: dd_kver
  changed_when: false

- name: Align the software image kernel version
  when: dd_kver.stdout | trim | length > 0
  delegate_to: bcm
  block:
    - name: Ensure lib/modules/<kver> exists in the image
      ansible.builtin.file:
        path: "{{ dd_image_root }}/lib/modules/{{ dd_kver.stdout | trim }}"
        state: directory
        mode: "0755"
    - name: Set the software image kernel version
      ansible.builtin.command: cmsh -c "softwareimage; use {{ dd_installer_image }}; set kernelversion {{ dd_kver.stdout | trim }}; commit"
      changed_when: true
      failed_when: false

- name: Check whether the profile category exists
  ansible.builtin.shell: cmsh -c "category; list" | grep -q '^{{ kairos_profile }}[[:space:]]'
  delegate_to: bcm
  register: dd_cat_exists
  changed_when: false
  failed_when: false

- name: Clone the profile category from the source category
  ansible.builtin.command: >-
    cmsh -c "category; clone \"{{ bcm_source_category | default('default') }}\" {{ kairos_profile }}; commit"
  delegate_to: bcm
  when: dd_cat_exists.rc != 0
  changed_when: true

- name: Configure the profile category (image + FULL install mode)
  ansible.builtin.command: 'cmsh -c "category; use {{ kairos_profile }}; {{ item }}; commit"'
  loop:
    - "set softwareimage {{ dd_installer_image }}"
    - "set installmode FULL"
    - "set newnodeinstallmode FULL"
    - "set installbootrecord yes"
  delegate_to: bcm
  changed_when: true
  failed_when: false

- name: Reconcile the category disksetup with the dd-install
  # See dd_disksetup_strip_glob in defaults/main.yml: BCM must not claim a disk
  # the FINALIZE stage owns, or it re-partitions it on the next PXE boot.
  when: deploy_dd_finalize_install | default(false) | bool
  delegate_to: bcm
  block:
    - name: List the Kairos disks the category disksetup still claims
      ansible.builtin.shell: |
        cmsh -c "category use {{ kairos_profile }}; get disksetup" 2> /dev/null \
          | grep -o '<blockdev[^>]*>[^<]*</blockdev>' \
          | sed -e 's|<blockdev[^>]*>||' -e 's|</blockdev>||' -e 's|^/dev/||' \
          | grep -E '{{ dd_disksetup_strip_glob }}' || true
      register: dd_ds_claimed
      changed_when: false

    - name: Refuse to deploy while the category claims a Kairos disk
      ansible.builtin.fail:
        msg: >-
          Category '{{ kairos_profile }}' claims Kairos-owned disks
          ({{ dd_ds_claimed.stdout_lines | join(', ') }}). BCM re-partitions
          these on every PXE boot, which would destroy the Kairos install and
          re-provision the node in a loop. Either point dd_disksetup_xml_file at
          a disksetup that omits them, or leave dd_category_datanode=true.
      when:
        - dd_ds_claimed.stdout_lines | length > 0
        - not (dd_category_datanode | bool)
        - dd_disksetup_xml_file | default('') | length == 0

    - name: Give the category a diskless disksetup so BCM partitions nothing
      # An empty <diskSetup></diskSetup> is rejected ("If diskless is not set,
      # there should be at least one device") -- `diskless` is an XML element,
      # not an attribute -- so point BCM at the diskless layout it ships.
      # Multiline stdin, not `cmsh -c`: the one-liner form silently no-ops on
      # some verbs (observed on `remove`, which returned rc=0 having removed
      # nothing), which would read as success here.
      ansible.builtin.command:
        cmd: cmsh
        stdin: |
          category
          use {{ kairos_profile }}
          set disksetup {{ dd_disksetup_diskless_file }}
          set datanode yes
          commit
      register: dd_ds_fix
      changed_when: dd_ds_fix.rc == 0
      when:
        - dd_ds_claimed.stdout_lines | length > 0
        - dd_category_datanode | bool

    - name: Apply the operator-supplied disksetup
      ansible.builtin.command: >-
        cmsh -c "category; use {{ kairos_profile }}; set disksetup {{ dd_disksetup_xml_file }}; commit"
      changed_when: true
      when:
        - dd_ds_claimed.stdout_lines | length > 0
        - dd_disksetup_xml_file | default('') | length > 0

    - name: Verify the category no longer claims a Kairos disk
      ansible.builtin.shell: |
        cmsh -c "category use {{ kairos_profile }}; get disksetup" 2> /dev/null \
          | grep -o '<blockdev[^>]*>[^<]*</blockdev>' \
          | sed -e 's|<blockdev[^>]*>||' -e 's|</blockdev>||' -e 's|^/dev/||' \
          | grep -E '{{ dd_disksetup_strip_glob }}' || true
      register: dd_ds_after
      changed_when: false
      failed_when: dd_ds_after.stdout_lines | length > 0

- name: Set the category kernel parameters (serial console + stable NIC naming)
  ansible.builtin.command: >-
    cmsh -c "category; use {{ kairos_profile }}; set kernelparameters \"console=ttyS0,115200n8 net.ifnames=0 biosdevname=0\"; commit"
  delegate_to: bcm
  changed_when: true
  failed_when: false

- name: Strip fsmounts that don't apply to the immutable OS (/cm/shared, /home)
  ansible.builtin.shell: |
    if cmsh -c "category; use {{ kairos_profile }}; fsmounts; list" 2>/dev/null | grep -q " {{ item }} "; then
      cmsh -c "category; use {{ kairos_profile }}; fsmounts; remove {{ item }}; commit"
    fi
  loop: ["/cm/shared", "/home"]
  delegate_to: bcm
  changed_when: true
  failed_when: false

- name: Exclude the profile category from incompatible health checks
  ansible.builtin.shell: |
    if ! cmsh -c "monitoring setup; use {{ item }}; nodeexecutionfilters; list" 2>/dev/null | grep -q 'exclude-{{ kairos_profile }}'; then
      cmsh -c "monitoring setup; use {{ item }}; nodeexecutionfilters; add category exclude-{{ kairos_profile }}; set filteroperation Exclude; set categories {{ kairos_profile }}; commit"
    fi
  loop: [mounts, interfaces, ntp]
  delegate_to: bcm
  changed_when: true
  failed_when: false

- name: Set cluster-wide defaults (owned-BCM only)
  ansible.builtin.command: 'cmsh -c "{{ item }}"'
  loop:
    - "partition; use base; set defaultcategory {{ kairos_profile }}; commit"
    - "partition; use base; set nodebasename node; set nodedigits 3; commit"
  delegate_to: bcm
  when: bcm_manage_cluster_defaults | default(false) | bool
  changed_when: true
  failed_when: false
