---
# image_http.yml — [1/7] compress + upload the raw image, [2/7] serve the
# /cm/shared/kairos tree over HTTP for the dd-installer to fetch.

# The compress + rsync upload live in playbooks/04-deploy-dd.yml:
# ansible.posix.synchronize must run in a play whose INVENTORY host is the BCM,
# which a `delegate_to: bcm` task inside this role cannot be. By the time this
# file runs, {{ dd_profile_share }}/disk.raw.lz4 is already in place.

- name: Install the Kairos image HTTP service unit
  ansible.builtin.copy:
    src: kairos-http.service
    dest: /etc/systemd/system/kairos-http.service
    mode: "0644"
  delegate_to: bcm
  register: dd_http_unit

- name: Enable + start the HTTP server (single shared unit for all profiles)
  ansible.builtin.systemd_service:
    name: kairos-http
    enabled: true
    state: started
    daemon_reload: true
  delegate_to: bcm

- name: Restart the HTTP server if its unit changed
  ansible.builtin.systemd_service:
    name: kairos-http
    state: restarted
  delegate_to: bcm
  when: dd_http_unit.changed

- name: Verify the image is reachable over HTTP
  ansible.builtin.uri:
    url: "http://localhost:8888/{{ kairos_profile }}/disk.raw.lz4"
    method: HEAD
    status_code: [200]
  delegate_to: bcm
  register: dd_http_probe
  retries: 5
  delay: 2
  until: dd_http_probe.status is defined and dd_http_probe.status == 200
