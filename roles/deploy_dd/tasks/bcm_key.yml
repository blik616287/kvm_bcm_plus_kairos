---
# bcm_key.yml — put the image's BCM SSH public key into the BCM's root
# authorized_keys, so the node-side cloud-config can run cmsh.
#
# The image bakes the private half at /var/lib/bcm/bcm-key; its cloud-config
# SSHes to the BCM as root to resolve NODE_NAME, read the device category for the
# bcm-category label, and commit `set installmode NOSYNC`. Every one of those
# calls is wrapped in `2>/dev/null` / `|| true`, so an unauthorized key does not
# error — it silently falls through to the hostname default, leaving the node on
# its `edge-<uuid>` name, posting `bcm-category: unknown` to Palette, and staying
# armed for reinstall. Must run before node.yml arms the node: the cloud-config
# runs on the node's FIRST boot. Idempotent.

- name: Check for the Kairos build public key (generated by kairos_build)
  ansible.builtin.stat:
    path: "{{ build_dir }}/bcm-kairos-key.pub"
  register: dd_bcm_key_pub

- name: Warn when the build public key is absent
  ansible.builtin.debug:
    msg: >-
      {{ build_dir }}/bcm-kairos-key.pub is missing (run stage 3 kairos-build
      first): the node's cloud-config cannot authenticate to the BCM, so
      NODE_NAME resolution, the bcm-category label and the installmode NOSYNC
      disarm will all fail silently.
  when: not dd_bcm_key_pub.stat.exists

- name: Authorize the Kairos build key on the BCM (node-side BCM integration)
  ansible.builtin.authorized_key:
    user: root
    key: "{{ lookup('file', build_dir ~ '/bcm-kairos-key.pub') }}"
    state: present
    manage_dir: false
  delegate_to: bcm
  when: dd_bcm_key_pub.stat.exists
