---
# pxe.yml — [5/7] PXE template + syslinux modules (cluster-wide, profile-agnostic).

# The IPAPPEND templates are upstream BCM files; a head node serving HTTP boot
# need not have them, so probe for them instead of swallowing a missing-file
# error — absence stays tolerated, but visibly, in the task graph.
- name: Look for the PXE boot templates
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /tftpboot/pxelinux.cfg/template
    - /tftpboot/x86_64/bios/pxelinux.cfg/template
  delegate_to: bcm
  register: dd_pxe_tmpl

- name: Force IPAPPEND 2 in the PXE templates (configure only the boot NIC)
  ansible.builtin.replace:
    path: "{{ item.stat.path }}"
    regexp: 'IPAPPEND 3'
    replace: 'IPAPPEND 2'
  loop: "{{ dd_pxe_tmpl.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.stat.path }}"
  delegate_to: bcm

# BIOS PXE menu modules. A UEFI-only head node need not carry them, so a missing
# source is reported rather than failing the deploy; a cp that fails with the
# source present still fails.
- name: Ensure the syslinux menu modules are present in /tftpboot
  ansible.builtin.shell: |
    for src in "/tftpboot/x86_64/bios/{{ item }}" "/usr/lib/syslinux/modules/bios/{{ item }}"; do
      [ -f "$src" ] && { cp "$src" "/tftpboot/{{ item }}" || exit 1; echo copied; exit 0; }
    done
    echo "absent"
  args:
    creates: "/tftpboot/{{ item }}"
  loop: [menu.c32, libutil.c32, ldlinux.c32, libcom32.c32]
  delegate_to: bcm
  register: dd_syslinux_mods
  changed_when: "'copied' in (dd_syslinux_mods.stdout | default(''))"

- name: Warn about syslinux menu modules the BCM does not have (BIOS PXE only)
  ansible.builtin.debug:
    msg: "No source for /tftpboot/{{ item.item }} on the BCM; BIOS PXE menus need it, UEFI boot does not."
  loop: "{{ dd_syslinux_mods.results | selectattr('stdout', 'defined') | selectattr('stdout', 'equalto', 'absent') | list }}"
  loop_control:
    label: "{{ item.item }}"
