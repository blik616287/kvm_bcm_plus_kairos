---
# pxe.yml — [5/7] PXE template + syslinux modules (cluster-wide, profile-agnostic).

- name: Force IPAPPEND 2 in the PXE templates (configure only the boot NIC)
  ansible.builtin.replace:
    path: "{{ item }}"
    regexp: 'IPAPPEND 3'
    replace: 'IPAPPEND 2'
  loop:
    - /tftpboot/pxelinux.cfg/template
    - /tftpboot/x86_64/bios/pxelinux.cfg/template
  delegate_to: bcm
  failed_when: false

- name: Ensure the syslinux menu modules are present in /tftpboot
  ansible.builtin.shell: |
    cp "/tftpboot/x86_64/bios/{{ item }}" "/tftpboot/{{ item }}" 2>/dev/null \
      || cp "/usr/lib/syslinux/modules/bios/{{ item }}" "/tftpboot/{{ item }}"
  args:
    creates: "/tftpboot/{{ item }}"
  loop: [menu.c32, libutil.c32, ldlinux.c32, libcom32.c32]
  delegate_to: bcm
  failed_when: false
