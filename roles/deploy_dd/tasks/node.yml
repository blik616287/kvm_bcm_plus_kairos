---
# node.yml — assign/register the target compute node into the profile category.
# Two paths: an EXISTING device on a remote/customer BCM (bcm_target_node), or a
# freshly-registered local-KVM node. The compute IP formula (node001 -> .10)
# mirrors roles/kairos_vm/defaults so the two stages agree (plan C.1 will hoist
# it to a shared var).
#
# cmsh exits non-zero when `use <name>` cannot find the device, but every
# set/commit in the same -c string is then a silent no-op — so a swallowed exit
# code reports success while nothing was armed (how dgx04 sat unarmed while the
# device was named edge-<uuid>). Nothing here masks the exit code, and each
# mutating task is followed by a `get` that proves the effect landed.

- name: Assign an existing BCM device to the profile (targeted/remote BCM)
  ansible.builtin.command: >-
    cmsh -c "device; use \"{{ bcm_target_node }}\";
    set category {{ kairos_profile }};
    set softwareimage {{ dd_installer_image }};
    set installmode FULL{% if kairos_target_mac | default('') | length > 0 %};
    set mac {{ kairos_target_mac }}{% endif %}{% if kairos_target_ip | default('') | length > 0 %};
    set ip {{ kairos_target_ip }}{% endif %};
    commit"
  delegate_to: bcm
  when: bcm_target_node | default('', true) | length > 0
  changed_when: true

- name: Assert the target device is registered and took the profile category
  ansible.builtin.command: cmsh -c "device; use \"{{ bcm_target_node }}\"; get category"
  delegate_to: bcm
  when: bcm_target_node | default('', true) | length > 0
  register: dd_node_category
  changed_when: false
  failed_when: >-
    dd_node_category.rc != 0
    or kairos_profile not in dd_node_category.stdout

# BCM keeps a one-shot `nextinstallmode` that overrides `installmode` for the very
# next boot. The node's own cloud-config disarm sets installmode=NOSYNC, which lands
# here as nextinstallmode=NOSYNC and poisons the re-image: the installer applies it,
# finds the category diskless, and aborts "Sync mode is NOSYNC, but this is a
# diskless node". Clear it after arming, then prove it is gone.
- name: Clear the one-shot nextinstallmode override left by the node's NOSYNC disarm
  ansible.builtin.command:
    cmd: cmsh
    stdin: |
      device
      use {{ bcm_target_node }}
      clear nextinstallmode
      commit
  delegate_to: bcm
  when: bcm_target_node | default('', true) | length > 0
  changed_when: true
  # No failed_when here on purpose: `clear` on an already-clear attribute is a
  # no-op, and the assert below is what actually proves the override is gone.

- name: Assert the target node carries no stale NOSYNC override
  ansible.builtin.command: cmsh -c "device; use \"{{ bcm_target_node }}\"; get nextinstallmode"
  delegate_to: bcm
  when: bcm_target_node | default('', true) | length > 0
  register: dd_nextinstallmode
  changed_when: false
  # rc is checked too: `use <unknown-device>` exits non-zero with an empty stdout,
  # so a NOSYNC-only test would pass that off as a clean node.
  failed_when: >-
    dd_nextinstallmode.rc != 0
    or 'NOSYNC' in dd_nextinstallmode.stdout

# Pre-authorize the FULL-install interaction for a bounded window so the install runs unattended.
- name: Pre-authorize the FULL-install interaction for the install window
  ansible.builtin.command: >-
    cmsh -c "device; use \"{{ bcm_target_node }}\";
    installerinteractions -w --confirm --mode full-install
    --for {{ deploy_dd_autoconfirm_window }}"
  delegate_to: bcm
  when:
    - bcm_target_node | default('', true) | length > 0
    - deploy_dd_autoconfirm_install | bool
  changed_when: true

- name: Register a fresh compute node (local-KVM / no target device)
  when: bcm_target_node | default('', true) | length == 0
  delegate_to: bcm
  vars:
    dd_compute_ip: "{{ bcm_internal_ip.rsplit('.', 1)[0] }}.{{ 9 + (dd_target_node | regex_replace('[^0-9]', '') | int) }}"
  block:
    # `device remove` exits 0 for a device that is not there, so ask before removing.
    - name: Probe for a stale registration of the node
      ansible.builtin.command: cmsh -c "device; use {{ dd_target_node }}; get hostname"
      register: dd_node_probe
      changed_when: false
      failed_when: false

    - name: Remove any stale registration for the node
      ansible.builtin.command: cmsh -c "device; remove {{ dd_target_node }}; commit"
      when: dd_node_probe.rc == 0
      changed_when: true

    # provisioninginterface is enp0s2: the local-KVM compute VM runs q35+OVMF, so
    # the installer env's systemd-networkd names the virtio NIC enp0s2 regardless
    # of net.ifnames=0 on the cmdline.
    - name: Register the compute node with explicit IP + MAC
      ansible.builtin.command: >-
        cmsh -c "device; add physicalnode {{ dd_target_node }} {{ dd_compute_ip }} enp0s2;
        set category {{ kairos_profile }};
        set softwareimage {{ dd_installer_image }};
        set installmode FULL;
        set mac {{ kairos_vm_mac | default('') }};
        set provisioninginterface enp0s2;
        commit"
      changed_when: true

    - name: Assert the fresh node registered with the profile category
      ansible.builtin.command: cmsh -c "device; use {{ dd_target_node }}; get category"
      register: dd_new_node_category
      changed_when: false
      failed_when: >-
        dd_new_node_category.rc != 0
        or kairos_profile not in dd_new_node_category.stdout
