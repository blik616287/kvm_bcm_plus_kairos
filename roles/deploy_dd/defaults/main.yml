---
# Install method for landing the Kairos raw image onto the compute node's disk.
#
# false (default) — legacy "stage-2" install: the <profile>-installer software
#   image is FULL-installed onto the node's local disk, the node boots it, and a
#   kairos-install systemd unit runs run-dd.sh to dd the Kairos raw image over
#   that same disk. Simple, and fine in local-KVM, but on a real BCM the dd
#   overwrites the *running* rootfs, so the post-dd steps (GPT backup-header fix,
#   COS_PERSISTENT grow, efibootmgr) execute in a torn-down environment and
#   silently fail ("timeout: No such file or directory", "couldn't detect last
#   partition, skipping grow"), and the console floods with kernel XFS errors.
#
# true — "finalize-stage" install: the dd runs as the BCM node-installer's
#   category FINALIZE script, i.e. from the node-installer's NFS root — which the
#   dd never overwrites. timeout/sgdisk/resize2fs all work, COS_PERSISTENT grows
#   to fill the target disk, the console stays clean, and (on a UEFI node-installer)
#   efibootmgr can run. The finalize script then forces a reboot so firmware boots
#   the freshly-written Kairos; otherwise the node-installer would switch_root into
#   the now-overwritten disk and drop to an emergency shell.
#
# Requirements when true (see roles/deploy_dd/tasks/finalize.yml):
#   - the compute node's firmware boot order must be DISK-FIRST with PXE fallback
#     — a blank disk falls through to PXE for the install; after the finalize
#     reboot the now-bootable disk is selected (net-first would re-PXE = a
#     reinstall loop);
#   - the profile category gets installbootrecord=no (finalize.yml sets it) so the
#     node-installer never tries to grub-install onto the Kairos disk.
deploy_dd_finalize_install: false

# Software-RAID layout (opt-in; requires deploy_dd_finalize_install=true and a
# RAID-capable image built with kairos_build_mdraid=true). Both are UNSET by
# default — the finalize tasks guard on `is defined`, so a normal single-disk
# deploy is byte-identical. Array CREATION happens in the finalize script (on the
# node), NOT the BCM disksetup, so we control mdadm metadata (1.0 for the OS
# mirror = UEFI-readable ESP; disksetup would use 1.2 and break boot).
#
# kairos_os_raid — the OS mirror that becomes the dd target. Must be a RAID1
#   (level 1) mirror; metadata 1.0; >=2 members. Set kairos_target_disk: /dev/md0.
#   RAID0/5/6/10 for the OS cannot boot (no member holds a complete ESP) and are
#   rejected by finalize.yml's assert.
#     kairos_os_raid: {level: 1, metadata: "1.0", devices: [nvme2n1, nvme3n1]}
#     kairos_target_disk: /dev/md0
#
# kairos_data_raid — zero or more data arrays (off the boot path → any level).
#   Each is created + mkfs'd with a stable LABEL; the finalize script then injects
#   a mountpoint + a systemd .mount unit (mount by-label, noatime, nofail) into the
#   cOS root images so it auto-mounts FAIL-OPEN at boot — a dead member never
#   blocks boot. (A baked systemd unit, not an /oem cloud-config: cOS's yip no-ops
#   /oem command steps and regenerates /etc/fstab, and its root is sealed RO.)
#     kairos_data_raid:
#       - {name: raid, level: 0, devices: [nvme0n1, nvme1n1], filesystem: ext4, mount: /raid}
#
# kairos_raid_select — how the device specs in kairos_os_raid.devices /
#   kairos_data_raid[].devices are resolved to real block devices at finalize time:
#     name (default) — literal kernel names: /dev/<spec>            (e.g. nvme2n1)
#     path           — udev by-path symlinks: /dev/disk/by-path/<spec>  (stable slot)
#     id             — udev by-id symlinks:   /dev/disk/by-id/<spec>    (model+serial)
#     size           — IGNORE the specs; OS mirror = the smallest N drives
#                      (N = len(kairos_os_raid.devices)), data array = the rest.
#   NVMe kernel names (nvmeXn1) are NOT stable across boots on some hardware (DGX A100:
#   a name maps to a different physical drive per install), so a name-pinned OS mirror
#   can span a large data disk — a size-mismatched mirror that thrashes and hangs boot.
#   Use 'size' (node-agnostic; assumes ONE data array) or 'path' (per PCIe slot; use
#   the by-path names the finalize logs in its drive inventory). 'id' pins exact serials.
kairos_raid_select: name

# Assert that the OS mirror members all have the SAME size and are the N smallest
# whole disks present. A spec that resolves is not necessarily the right disk: a
# by-path pin landing on a data disk builds a mismatched mirror, which thrashes
# and hangs boot. Turn off only if the OS mirror is deliberately not the
# smallest disks on the node.
kairos_os_raid_assert_smallest: true

# --- dd-install: BCM must not claim a Kairos disk ---------------------------
# The FINALIZE stage owns the disks end to end (wipes the members, builds the OS
# mirror, dd's the image onto it). BCM re-applies its own disksetup on every PXE
# boot, so any disk the category names is re-partitioned out from under Kairos:
# the install is destroyed and the node re-provisions in a loop. The category
# inherits its clone source's disksetup, and `category clone` is skipped once
# the category exists (category.yml), so this must be enforced on every deploy,
# not just the first. Anything whose kernel name matches dd_disksetup_strip_glob
# is treated as Kairos-owned and may not appear in the category disksetup.
dd_disksetup_strip_glob: "^nvme"
# BCM's no-local-OS mode. It is what makes an empty disksetup legal, and it is
# what a dd-install wants: the node-installer runs over NFS and the FINALIZE
# stage lays out every disk itself, so BCM has no OS to install on a disk.
dd_category_datanode: true
# The disksetup a dd-install hands BCM. It must leave BCM nothing to partition:
# BCM re-applies it on every PXE boot, so any disk it names is re-partitioned
# out from under Kairos. An EMPTY <diskSetup></diskSetup> is rejected ("If
# diskless is not set, there should be at least one device") because `diskless`
# is an XML element, not an attribute -- so point BCM at the diskless layout it
# ships (siblings in that dir: raid0-8-cache-drives, stig, one-big-partition).
dd_disksetup_diskless_file: "/cm/local/apps/cmd/etc/htdocs/disk-setup/slave-diskless.xml"
# Escape hatch: a full disksetup XML to apply instead — e.g. to keep a dormant
# BCM root on disks that are NOT Kairos-owned. Takes precedence over datanode.
dd_disksetup_xml_file: ""
