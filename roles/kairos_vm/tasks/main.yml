---
# kairos_vm — Launch Kairos compute node in local KVM.
# PXE boots from BCM on the internal socket network.
# Flow: PXE → BCM provisions installer → dd writes Kairos → sysrq poweroff →
#       reboot from disk → Kairos active

# Artifact paths, VM name, serial port and the node identity (kairos_node_name)
# come from roles/kairos_vm/defaults/main.yml — they derive from the node
# number so a second concurrent node (node002) gets a non-colliding set.
- name: Set Kairos VM variables
  ansible.builtin.set_fact:
    ssh_opts: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR"
    bcm_ssh_cmd: "sshpass -p {{ bcm_password }} ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -p {{ bcm_ssh_port }} root@localhost"

- name: Detect display availability
  ansible.builtin.shell: |
    if [ -n "${DISPLAY:-}" ] || [ -n "${WAYLAND_DISPLAY:-}" ]; then
      if command -v xdpyinfo >/dev/null 2>&1 && xdpyinfo >/dev/null 2>&1; then
        echo "gtk"
      elif command -v xset >/dev/null 2>&1 && xset q >/dev/null 2>&1; then
        echo "gtk"
      else
        echo "none"
      fi
    else
      echo "none"
    fi
  register: qemu_display_type
  changed_when: false

- name: Create logs directory
  ansible.builtin.file:
    path: "{{ e2e_dir }}/logs"
    state: directory

- name: Kill any existing Kairos VM
  ansible.builtin.shell: |
    PID=$(cat "{{ kairos_pid_file }}" 2>/dev/null) && kill "$PID" 2>/dev/null || true
    # Match the exact QEMU -name token so killing node001 will not also kill a
    # concurrently-running node002 (whose name is a superstring).
    pkill -f "qemu-system.*-name {{ kairos_vm_name }} " 2>/dev/null || true
    sleep 2
  become: true
  changed_when: false
  failed_when: false

- name: Reset {{ kairos_node_name }} install mode to FULL before recreating disk
  ansible.builtin.shell: |
    {{ bcm_ssh_cmd }} "echo -e 'device\nuse {{ kairos_node_name }}\nset installmode FULL\ncommit' | cmsh 2>&1"
  changed_when: true

- name: Create fresh Kairos disk + OVMF vars
  ansible.builtin.shell: |
    rm -f "{{ kairos_disk }}" "{{ kairos_ovmf_vars }}"
    qemu-img create -f qcow2 "{{ kairos_disk }}" {{ kairos_vm_disk_size }}
    # Per-VM writable copy of OVMF UEFI vars — matches the OVMF firmware used by
    # kairos_build. Shared between PXE-install and disk-boot phases so efibootmgr
    # entries created during install persist into the post-install boot.
    OVMF_VARS_SRC=/usr/share/OVMF/OVMF_VARS_4M.fd
    [ -f "$OVMF_VARS_SRC" ] || OVMF_VARS_SRC=/usr/share/ovmf/OVMF.fd
    cp -f "$OVMF_VARS_SRC" "{{ kairos_ovmf_vars }}"

- name: Detect KVM acceleration
  ansible.builtin.shell: test -e /dev/kvm && echo "-enable-kvm" || echo ""
  register: kvm_flag
  changed_when: false

- name: Render the shared Kairos QEMU launcher
  ansible.builtin.template:
    src: kairos-qemu.sh.j2
    dest: "{{ build_dir }}/kairos-qemu-{{ kairos_vm_slug }}.sh"
    mode: "0755"

- name: Launch Kairos compute VM (PXE boot, OVMF/UEFI)
  # order=cn = PXE then disk; -no-reboot powers the VM off after dd so the
  # play can detect install completion.
  ansible.builtin.command: "{{ build_dir }}/kairos-qemu-{{ kairos_vm_slug }}.sh order=cn -no-reboot"

- name: Display Kairos VM info
  ansible.builtin.debug:
    msg:
      - "Kairos compute VM started (PXE boot from BCM)"
      - "Serial log: {{ kairos_serial_log }}"
      - "Flow: PXE → installer → dd → poweroff → disk boot → Kairos"

# ---- Non-blocking mode: hand off to a detached finisher and return ----

- name: Drive install → disk-boot in the background (non-blocking mode)
  when: not (kairos_vm_wait | default(true) | bool)
  block:
    - name: Render background finisher script
      ansible.builtin.template:
        src: kairos-finish.sh.j2
        dest: "{{ build_dir }}/kairos-finish-{{ kairos_vm_slug }}.sh"
        mode: "0755"

    - name: Launch background finisher (detached)
      ansible.builtin.shell: |
        setsid nohup "{{ build_dir }}/kairos-finish-{{ kairos_vm_slug }}.sh" \
          </dev/null > "{{ e2e_dir }}/logs/{{ kairos_vm_slug }}-finish.log" 2>&1 &
        echo "started"
      changed_when: true

    - name: Show non-blocking note
      ansible.builtin.debug:
        msg:
          - "{{ kairos_node_name }} launched NON-BLOCKING — playbook returning now."
          - "It will PXE-install, power off, then auto-boot from disk in the background."
          - "Track: tail -f logs/{{ kairos_vm_slug }}-finish.log  +  logs/{{ kairos_vm_slug }}-serial.log"
          - "Validate once up: make validate ANSIBLE_ARGS='-e kairos_profile=<p> -e kairos_node_name={{ kairos_node_name }}'"

# ---- Blocking mode (default): wait for install, boot from disk, wait for boot ----

- name: Render wait-for-boot script
  when: kairos_vm_wait | default(true) | bool
  ansible.builtin.template:
    src: wait-kairos-boot.sh.j2
    dest: "{{ build_dir }}/wait-kairos-boot.sh"
    mode: "0755"

- name: Wait for dd install to complete (VM powers off, up to 30 min)
  when: kairos_vm_wait | default(true) | bool
  ansible.builtin.shell: |
    TIMEOUT=1800
    ELAPSED=0
    PID=$(cat "{{ kairos_pid_file }}" 2>/dev/null)
    echo "Waiting for Kairos VM to power off after dd (PID $PID)..."
    while [ $ELAPSED -lt $TIMEOUT ]; do
      kill -0 "$PID" 2>/dev/null || { echo "VM powered off at ${ELAPSED}s"; exit 0; }
      sleep 10
      ELAPSED=$((ELAPSED + 10))
    done
    echo "TIMEOUT after ${TIMEOUT}s"
    exit 1
  register: poweroff_result
  async: 1860
  poll: 15

# ---- Reboot from disk ----

# Reusable disk-boot command. The FIRST post-install disk boot lands on the
# Palette `stylus.registration` GRUB entry; in an isolated/local-KVM network it
# cannot reach Palette, so it parks in registration mode and never brings up the
# kairos user or sshd. kairos-agent already set the default GRUB entry to the
# active "Palette eXtended Kubernetes Edge" image during install, so the NEXT
# boot comes up healthy. We therefore reset the VM once if the first boot stalls.
- name: Compose Kairos disk-boot command (reuses the shared launcher, boot=c)
  when: kairos_vm_wait | default(true) | bool
  ansible.builtin.set_fact:
    kairos_disk_boot_cmd: "{{ build_dir }}/kairos-qemu-{{ kairos_vm_slug }}.sh c"

- name: Start Kairos VM from disk (OVMF/UEFI, reuses vars with Kairos boot entry)
  when: kairos_vm_wait | default(true) | bool
  ansible.builtin.command: "{{ kairos_disk_boot_cmd }}"

- name: Wait for Kairos to fully boot (reset past stylus.registration first-boot if needed)
  when: kairos_vm_wait | default(true) | bool
  block:
    - name: Wait for Kairos to fully boot (up to 10 min)
      ansible.builtin.shell: "{{ build_dir }}/wait-kairos-boot.sh"
      register: kairos_boot_result
      timeout: 600
  rescue:
    - name: First disk boot stalled — reset VM into the active Kairos entry
      ansible.builtin.debug:
        msg: >-
          First disk boot did not become reachable (likely parked in the
          stylus.registration first-boot). Resetting the VM; the default GRUB
          entry is the active image, so this boot should come up healthy.

    - name: Kill the stalled Kairos VM
      ansible.builtin.shell: |
        PID=$(cat "{{ kairos_pid_file }}" 2>/dev/null) && kill "$PID" 2>/dev/null || true
        pkill -f "qemu-system.*{{ kairos_vm_name }}" 2>/dev/null || true
        sleep 2; true
      changed_when: false

    - name: Re-launch Kairos VM from disk (active entry)
      ansible.builtin.command: "{{ kairos_disk_boot_cmd }}"

    - name: Wait for Kairos to fully boot after reset (up to 10 min)
      ansible.builtin.shell: "{{ build_dir }}/wait-kairos-boot.sh"
      register: kairos_boot_result
      timeout: 600

- name: Show Kairos boot result
  when: kairos_vm_wait | default(true) | bool
  ansible.builtin.debug:
    msg: "{{ kairos_boot_result.stdout_lines | default(['unknown']) | last }}"
