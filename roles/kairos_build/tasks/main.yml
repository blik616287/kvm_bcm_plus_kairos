---
# kairos_build — Build Kairos ISO via CanvOS + generate raw disk image via local QEMU.
# OVMF (UEFI) build for UEFI hardware. The build artifact is namespaced by
# `kairos_profile` so multiple profiles can coexist on the build host.

- name: Capture invoking user (ansible.cfg has become=true, so most tasks run as root;
        we need the original user to chown artifacts back at the end)
  ansible.builtin.command: whoami
  register: invoking_user
  become: false
  changed_when: false

- name: Resolve effective CanvOS .arg dict (defaults | user overrides)
  ansible.builtin.set_fact:
    canvos_dir: "{{ e2e_dir }}/CanvOS"
    kairos_canvos_args_effective: "{{ kairos_canvos_defaults | combine(kairos_canvos_args | default({})) }}"

- name: Derive pipeline-load-bearing facts from the merged .arg dict
  ansible.builtin.set_fact:
    iso_name: "{{ kairos_canvos_args_effective.ISO_NAME }}"
    arch:     "{{ kairos_canvos_args_effective.ARCH }}"
    raw_disk_path: "{{ build_dir }}/{{ kairos_profile }}-disk.raw"

# ---- Clone CanvOS if missing ----

- name: Check if CanvOS exists
  ansible.builtin.stat:
    path: "{{ canvos_dir }}/.git"
  register: canvos_stat

- name: Clone CanvOS
  ansible.builtin.git:
    repo: https://github.com/spectrocloud/CanvOS.git
    dest: "{{ canvos_dir }}"
  when: not canvos_stat.stat.exists

# ---- Build Kairos ISO ----

- name: Ensure build directory exists
  ansible.builtin.file:
    path: "{{ build_dir }}"
    state: directory
    mode: "0755"

- name: Check if Kairos ISO exists
  ansible.builtin.stat:
    path: "{{ build_dir }}/{{ iso_name }}.iso"
  register: kairos_iso_stat

# Stamp the build's INPUTS. The day-1 short-circuit below reuses a cached ISO
# whenever the .iso file merely exists -- and because every Earthfile and
# Dockerfile patch AND ./earthly.sh +iso live INSIDE that block, a cached ISO
# makes any later patch inert on this host: it never reaches the ISO, the
# rootfs, or the initramfs. Stamping the inputs means editing a role, profile,
# or overlay forces a rebuild instead of silently shipping the old image.
- name: Compute the ISO build-input stamp
  ansible.builtin.shell: |
    find {{ e2e_dir }}/roles/kairos_build {{ e2e_dir }}/files/canvos \
         {{ e2e_dir }}/profiles/{{ kairos_profile }}.yml \
         {{ e2e_dir }}/inventory/group_vars/all.yml \
         -type f -print0 2>/dev/null \
      | sort -z | xargs -0 sha256sum 2>/dev/null | sha256sum | awk '{print $1}'
  register: kairos_iso_stamp
  changed_when: false

- name: Read the recorded ISO build-input stamp
  ansible.builtin.command: cat {{ build_dir }}/.iso-stamp-{{ kairos_profile }}
  register: kairos_iso_stamp_rec
  changed_when: false
  failed_when: false

# Day-1 (raw_disk=true) skips this when the ISO already exists in build/.
# Day-2 (raw_disk=false) always runs — the goal is to push provider images
# to the registry, no local-artifact short-circuit applies.
- name: Build Kairos ISO
  when:
    - (not kairos_iso_stat.stat.exists)
      or (kairos_iso_stamp_rec.stdout | default('') != kairos_iso_stamp.stdout)
      or not (kairos_build_raw_disk | default(true) | bool)
  block:
    - name: Generate .arg file from merged dict
      ansible.builtin.template:
        src: "{{ e2e_dir }}/files/canvos/.arg.template"
        dest: "{{ canvos_dir }}/.arg"

    - name: Copy overlay files into CanvOS
      ansible.builtin.shell: cp -rp {{ e2e_dir }}/files/canvos/overlay/* {{ canvos_dir }}/overlay/ 2>/dev/null || true

    - name: Drop the BCM stylus-agent hook for images that do not carry its scripts
      # bcm-sync.conf adds ExecStartPre=/usr/bin/palette-cleanup-stale.sh and
      # bcm-sync-userdata.sh to stylus-agent. Those scripts reach an image ONLY
      # through the Dockerfile COPY above, and an appliance build installs a
      # different rootfs than the one CanvOS customises -- so the unit ships
      # referencing executables that are not there. systemd then fails it
      # 203/EXEC and restarts forever (675 attempts on the run that found
      # this), stylus never starts, and Palette never deploys: the node boots
      # clean, the Local UI answers, the bundle uploads, and the cluster simply
      # stops at Provisioning with nothing pointing at the cause.
      #
      # The appliance is not a BCM-registered edge node -- it neither syncs a
      # hostname from BCM nor pre-cleans a Palette registration -- so the hook
      # is pure liability there. The next edge build's `cp -rp` above restores
      # the file, so this cannot leak in the other direction.
      ansible.builtin.file:
        path: "{{ canvos_dir }}/overlay/files/etc/systemd/system/stylus-agent.service.d/bcm-sync.conf"
        state: absent
      when: not (kairos_build_bcm_integration | default(true) | bool)

    - name: Ensure overlay scripts are executable
      ansible.builtin.file:
        path: "{{ item }}"
        mode: "0755"
      loop:
        - "{{ canvos_dir }}/overlay/files/usr/bin/bcm-compat-fixes.sh"
        - "{{ canvos_dir }}/overlay/files/usr/bin/bcm-sync-userdata.sh"
        - "{{ canvos_dir }}/overlay/files/usr/bin/palette-cleanup-stale.sh"
      failed_when: false

    - name: Patch Earthfile — add BCM packages (+ mdadm when kairos_build_mdraid)
      # mdadm must be installed HERE (the Earthfile core build), not via the
      # Dockerfile layer / kairos_extra_apt_packages — the initramfs is built in
      # this stage, so dracut's mdraid module needs the mdadm binary present now.
      ansible.builtin.replace:
        path: "{{ canvos_dir }}/Earthfile"
        regexp: 'apt-get install --no-install-recommends kbd'
        replace: 'apt-get install --no-install-recommends wget ifupdown nfs-common {{ "mdadm " if (kairos_build_mdraid | default(false) | bool) else "" }}kbd'

    # NOTE: the replace above matches nothing on current CanvOS (the package list
    # no longer has that shape), so it adds nothing; mdadm reaches the image from
    # the Kairos base. Whether mdadm and the mdraid module actually landed is
    # asserted on the BUILT image (rootfs + initramfs) further down, which checks
    # the outcome rather than this text.

    # CanvOS writes `RUN DEBIAN_FRONTEND=noninteractive apt-get update && apt-get
    # upgrade ...`. The env assignment binds only to `apt-get update`, so the
    # upgrade runs with debconf's default Dialog frontend; with no controlling
    # tty that falls back to Teletype and prompts on stdin, and any package whose
    # config script dereferences an unset debconf value dies mid-upgrade.
    # console-setup 1.226ubuntu1.1 (noble-updates) does exactly this, failing
    # dpkg 100 with "sed: -e expression #1, char 8: unterminated `s' command".
    # Setting the frontend once for the whole stage fixes the class, not just
    # that one package. The ENV is placed at the anchor's own indent. Remove-
    # then-insert keeps this stable: a re-run rewrites identical bytes and
    # reports unchanged rather than duplicating the line.
    - name: Patch Earthfile — run the base-image apt stage noninteractively
      ansible.builtin.shell: |
        set -eu
        f={{ canvos_dir }}/Earthfile
        before=$(sha256sum "$f" | cut -d' ' -f1)
        sed -i '/^[[:space:]]*ENV DEBIAN_FRONTEND=noninteractive$/d' "$f"
        i=$(grep -nE '^[[:space:]]*LET APT_UPGRADE_FLAGS=' "$f" | head -1 | cut -d: -f1)
        [ -n "$i" ] || { echo "APT_UPGRADE_FLAGS anchor not found in $f" >&2; exit 1; }
        ind=$(sed -n "${i}p" "$f" | sed 's/LET .*//')
        awk -v n="$i" -v ind="$ind" 'NR==n{print ind "ENV DEBIAN_FRONTEND=noninteractive"} {print}' "$f" > "$f.tmp"
        mv "$f.tmp" "$f"
        after=$(sha256sum "$f" | cut -d' ' -f1)
        if [ "$before" = "$after" ]; then echo unchanged; else echo changed; fi
      register: kairos_apt_env_patch
      changed_when: "'changed' in kairos_apt_env_patch.stdout"

    - name: Assert the base-image apt stage is noninteractive
      ansible.builtin.assert:
        that:
          - "'ENV DEBIAN_FRONTEND=noninteractive' in lookup('file', canvos_dir ~ '/Earthfile')"
        fail_msg: "CanvOS Earthfile base-image stage is not noninteractive — apt can then fail on a debconf prompt (console-setup 1.226ubuntu1.1 fails this way with 'unterminated s command')."

    # Resolve the dracut guard's indentation at runtime instead of hardcoding it.
    # CanvOS releases nest this IF differently (v4.9.36 at 12 spaces,
    # v4.10.0-rc.2 at 16), and a line inserted at the wrong depth lands outside
    # the block that runs dracut — the conf files get written but never reach the
    # initramfs. Fails loudly if a release renames or drops the guard, rather
    # than silently producing an initrd with no mdraid and no pinned array.
    - name: Locate the dracut FIPS guard in the CanvOS Earthfile
      ansible.builtin.shell: |
        set -eu
        i=$(grep -nE '^[[:space:]]*IF \[ "\$FIPS_ENABLED" = "false" \]' {{ canvos_dir }}/Earthfile | head -1 | cut -d: -f1)
        [ -n "$i" ] || { echo "dracut FIPS guard not found in {{ canvos_dir }}/Earthfile" >&2; exit 1; }
        sed -n "${i}p" {{ canvos_dir }}/Earthfile | sed 's/IF \[.*//' | tr -d '\n'
      register: kairos_dracut_guard
      changed_when: false

    - name: Record the dracut guard indentation
      ansible.builtin.set_fact:
        kairos_dracut_indent: "{{ kairos_dracut_guard.stdout }}"

    - name: Patch Earthfile — skip dracut nfit
      ansible.builtin.lineinfile:
        path: "{{ canvos_dir }}/Earthfile"
        insertafter: 'IF \[ "\$FIPS_ENABLED" = "false" \]'
        regexp: "> /etc/dracut.conf.d/99-skip-nfit.conf"
        line: "{{ kairos_dracut_indent }}    RUN echo 'omit_dracutmodules+=\" nfit \"' > /etc/dracut.conf.d/99-skip-nfit.conf"

    # Ubuntu 26.04 ships systemd 259 built +APPARMOR, which dlopens
    # libapparmor.so.1 when it execs a service. The Kairos initramfs build does
    # not bundle that lib, so in the initrd systemd cannot start immucore.service
    # ("Shared library 'libapparmor.so.1' is not available") -> initrd.target
    # dependency fails -> dracut emergency mode -> the node never assembles its
    # cOS root and never boots. Force-install the lib into the initramfs.
    # Harmless on older releases (just an extra lib); fixes the 26.04 boot hang.
    - name: Patch Earthfile — bundle libapparmor into initramfs (Ubuntu 26.04 boot fix)
      ansible.builtin.lineinfile:
        path: "{{ canvos_dir }}/Earthfile"
        insertafter: 'IF \[ "\$FIPS_ENABLED" = "false" \]'
        regexp: "> /etc/dracut.conf.d/10-apparmor.conf"
        line: "{{ kairos_dracut_indent }}    RUN echo 'install_items+=\" /usr/lib/x86_64-linux-gnu/libapparmor.so.1 \"' > /etc/dracut.conf.d/10-apparmor.conf"

    # Pull the dracut `mdraid` module (+ its mdadm binary) into the initramfs so
    # the node can `mdadm --assemble` its OS array in the initqueue, before the
    # cOS root pivot — otherwise COS_STATE living on /dev/md0 is never found and
    # boot drops to the dracut emergency shell. Paired with rd.auto=1 (below) and
    # the Earthfile mdadm install (above). Gated: default build is unchanged.
    - name: Patch Earthfile — include dracut mdraid module (kairos_build_mdraid)
      ansible.builtin.lineinfile:
        path: "{{ canvos_dir }}/Earthfile"
        insertafter: 'IF \[ "\$FIPS_ENABLED" = "false" \]'
        regexp: "> /etc/dracut.conf.d/15-mdraid.conf"
        line: "{{ kairos_dracut_indent }}    RUN echo 'add_dracutmodules+=\" mdraid \"' > /etc/dracut.conf.d/15-mdraid.conf"
        state: "{{ 'present' if (kairos_build_mdraid | default(false) | bool) else 'absent' }}"

    # Pin the OS array in mdadm.conf, for two reasons that are separate bugs.
    # (1) Boot-time auto-assembly names the array md127 when homehost does not
    # match the assembling host, so anything expecting /dev/md0 -- the finalize
    # dd target, the stage-6 check -- finds nothing. An explicit ARRAY line fixes
    # the name. (2) devices= pins the members to the stable by-path names, so
    # assembly follows the same slots kairos_raid_select: path selected and
    # cannot land on a data disk after an nvmeXn1 reshuffle.
    # HOMEHOST is a SEPARATE top-level directive, NOT an ARRAY-line token. Written
    # the other way it read `ARRAY /dev/md0 ... homehost=none ...`, which mdadm 4.3
    # rejects outright -- "unrecognised word on ARRAY line: homehost=none" -- and
    # the WHOLE line is then discarded, taking name= and devices= with it. The pin
    # silently did nothing and the array came up as md127 on dgx04 (2026-09-28).
    # printf, not echo: the file needs two lines and echo cannot emit the newline.
    # This MUST be written in the Earthfile core build, not on the raw's cOS
    # images afterwards: dracut reads /etc/mdadm/mdadm.conf from the initramfs,
    # which is built in this stage, so a later write reaches only the rootfs.
    - name: Patch Earthfile — pin the OS array in mdadm.conf (kairos_build_mdraid)
      ansible.builtin.lineinfile:
        path: "{{ canvos_dir }}/Earthfile"
        insertafter: 'IF \[ "\$FIPS_ENABLED" = "false" \]'
        # Matches either the old echo form or the new printf form, so a CanvOS
        # checkout already patched by the broken version gets REPLACED rather
        # than gaining a second, still-broken ARRAY line.
        regexp: "RUN mkdir -p /etc/mdadm"
        line: >-
          {{ kairos_dracut_indent }}    RUN mkdir -p /etc/mdadm && printf 'HOMEHOST none\nARRAY /dev/md0
          metadata={{ (kairos_os_raid | default({})).metadata | default('1.0') }} name=md0{{ kairos_mdadm_devices }}\n'
          > /etc/mdadm/mdadm.conf
        state: "{{ 'present' if (kairos_build_mdraid | default(false) | bool) else 'absent' }}"
      vars:
        # devices= only when the specs ARE stable udev names (path/id). Under
        # `size` or `name` they are kernel names (nvme0n1) that do not exist
        # under /dev/disk/by-*, and a devices= list matching nothing keeps
        # `mdadm --assemble --scan` from assembling the array at all.
        kairos_mdadm_devices: >-
          {%- set sel = kairos_raid_select | default('name') -%}
          {%- if sel in ['path', 'id'] -%}
          {{ ' devices=' ~ ((kairos_os_raid | default({})).devices | default([]) | map('regex_replace', '^', '/dev/disk/by-' ~ sel ~ '/') | join(',')) }}
          {%- endif -%}

    # dracut's 90mdraid module installs mdadm.conf only when $hostonly is set or
    # mdadmconf="yes"; Kairos images are built non-hostonly (one image must boot
    # on any node), so without this the ARRAY line above stays in the rootfs and
    # never reaches the initramfs. dracut then auto-assembles the array as md127
    # instead of md0, and the finalize dd target and the stage-6 checks find
    # nothing. parse-md.sh reads /etc/mdadm.conf inside the initrd; the module
    # installs the rootfs /etc/mdadm/mdadm.conf under that name.
    - name: Patch Earthfile — force mdadm.conf into the initramfs (kairos_build_mdraid)
      ansible.builtin.lineinfile:
        path: "{{ canvos_dir }}/Earthfile"
        insertafter: 'IF \[ "\$FIPS_ENABLED" = "false" \]'
        regexp: "> /etc/dracut.conf.d/16-mdadm-conf.conf"
        line: "{{ kairos_dracut_indent }}    RUN echo 'mdadmconf=\"yes\"' > /etc/dracut.conf.d/16-mdadm-conf.conf"
        state: "{{ 'present' if (kairos_build_mdraid | default(false) | bool) else 'absent' }}"

    - name: Assert the initramfs mdadm.conf will actually be honoured by mdadm
      ansible.builtin.assert:
        that:
          - "'16-mdadm-conf.conf' in lookup('file', canvos_dir ~ '/Earthfile')"
          - "'HOMEHOST none' in lookup('file', canvos_dir ~ '/Earthfile')"
          - "'homehost=' not in lookup('file', canvos_dir ~ '/Earthfile')"
        fail_msg: >-
          mdadm.conf handling is wrong. dracut must ship the file (mdadmconf=yes,
          above) AND mdadm must accept it. `homehost=` is NOT an ARRAY-line token:
          mdadm rejects the whole line with "unrecognised word on ARRAY line", so
          name= and devices= are dropped with it and the array assembles as md127.
          Homehost belongs on its own top-level HOMEHOST line.
      when: kairos_build_mdraid | default(false) | bool

    - name: Patch Dockerfile — add BCM scripts (COPY + chmod +x as real Dockerfile instructions)
      ansible.builtin.blockinfile:
        path: "{{ canvos_dir }}/Dockerfile"
        insertafter: 'Add any other image customizations here'
        marker: "# {mark} BCM compat scripts"
        block: |
          COPY overlay/files/usr/bin/bcm-compat-fixes.sh /usr/bin/bcm-compat-fixes.sh
          COPY overlay/files/usr/bin/bcm-sync-userdata.sh /usr/bin/bcm-sync-userdata.sh
          COPY overlay/files/usr/bin/palette-cleanup-stale.sh /usr/bin/palette-cleanup-stale.sh
          RUN chmod +x /usr/bin/bcm-compat-fixes.sh /usr/bin/bcm-sync-userdata.sh /usr/bin/palette-cleanup-stale.sh

    # `state:` rather than `when:` for the same reason as the block below: all
    # profiles share one CanvOS checkout, so a `when:`-guarded blockinfile
    # leaves the previous profile's packages in place when the next profile
    # sets none. Live since profiles/palette-appliance.yml became the first
    # profile to use this — building it then an edge profile would otherwise
    # ship lvm2/drbd-utils in the edge image.
    - name: Patch Dockerfile — install user-supplied apt packages
      ansible.builtin.blockinfile:
        path: "{{ canvos_dir }}/Dockerfile"
        insertafter: "BCM compat scripts END"
        marker: "# {mark} user extra packages"
        block: |
          RUN apt-get update && apt-get install -y --no-install-recommends {{ kairos_extra_apt_packages | join(' ') }} && rm -rf /var/lib/apt/lists/*
        state: "{{ 'present' if kairos_extra_apt_packages | default([]) | length > 0 else 'absent' }}"

    # state is driven by whether the profile sets the block, NOT `when:` —
    # profiles share one CanvOS checkout, so a block left behind by a previous
    # profile's build would silently contaminate the next profile's image.
    - name: Patch Dockerfile — profile-supplied extra instructions
      ansible.builtin.blockinfile:
        path: "{{ canvos_dir }}/Dockerfile"
        insertafter: "user extra packages END"
        marker: "# {mark} profile extra dockerfile"
        block: "{{ kairos_dockerfile_extra }}"
        state: "{{ 'present' if kairos_dockerfile_extra | default('') | length > 0 else 'absent' }}"

    # dracut assembles the md array only when rd.auto is on the kernel line. The
    # day-2 Palette path never runs the raw's post-install bootargs patch, so the
    # provider image must carry rd.auto in its own /etc/cos/bootargs.cfg instead
    # of depending on the node's grubenv alone. provider-image and iso-image are
    # both FROM +base-image, so this one RUN reaches both. Guarded so UKI images
    # (no bootargs.cfg) are skipped, and idempotent so a re-run cannot duplicate
    # the token -- the same shape as the existing
    # systemd.unified_cgroup_hierarchy RUN just below it.
    - name: Patch Dockerfile — pin rd.auto on the image cmdline (kairos_build_mdraid)
      ansible.builtin.blockinfile:
        path: "{{ canvos_dir }}/Dockerfile"
        insertafter: 'Add any other image customizations here'
        marker: "# {mark} mdraid rd.auto"
        block: |
          RUN if [ -f /etc/cos/bootargs.cfg ] && ! grep -Fq "rd.auto=1" /etc/cos/bootargs.cfg; then \
                  sed -i 's|\(set baseCmd="[^"]*\)"|\1 rd.auto=1"|' /etc/cos/bootargs.cfg; \
              fi
        state: "{{ 'present' if (kairos_build_mdraid | default(false) | bool) else 'absent' }}"

    - name: Assert rd.auto lands in the image cmdline (kairos_build_mdraid)
      ansible.builtin.assert:
        that:
          - "'rd.auto=1' in lookup('file', canvos_dir ~ '/Dockerfile')"
        fail_msg: "CanvOS Dockerfile does not pin rd.auto=1, so the provider image's own bootargs.cfg lacks it and dracut will not assemble the OS mirror after a Palette upgrade."
      when: kairos_build_mdraid | default(false) | bool

    - name: Render custom k8s_version.json (overrides upstream CanvOS file)
      ansible.builtin.copy:
        content: "{{ kairos_k8s_versions | to_nice_json }}\n"
        dest: "{{ canvos_dir }}/k8s_version.json"
        mode: "0644"
      when: kairos_k8s_versions | default({}) | length > 0

    # Day-1 (kairos_build_raw_disk=true): build the ISO. Container images
    # used at install time are baked INTO the ISO via SAVE IMAGE (local
    # Docker), not pushed to IMAGE_REGISTRY — fine because day-1 install is
    # PXE+dd, not registry-pulled.
    # Day-2 (kairos_build_raw_disk=false): push the provider-image matrix
    # to IMAGE_REGISTRY; skip ISO assembly entirely. Palette pulls the new
    # image tag and rolling-upgrades cluster nodes — no PXE/dd needed.
    # The `--push` CLI flag is load-bearing — without it `SAVE IMAGE --push`
    # in the Earthfile is a no-op (image only goes to local Docker daemon).
    # Written before the ISO build so CanvOS can bake it in. state: is driven by
    # the variable, not `when:`, because profiles share one CanvOS checkout and
    # a leftover file would silently apply to the next profile's image.
    - name: Write .edge-custom-config.yaml (content-signing key, etc.)
      ansible.builtin.copy:
        content: "{{ kairos_edge_custom_config }}"
        dest: "{{ canvos_dir }}/.edge-custom-config.yaml"
        mode: "0644"
      when: kairos_edge_custom_config | default('') | length > 0

    - name: Remove a stale .edge-custom-config.yaml left by another profile
      ansible.builtin.file:
        path: "{{ canvos_dir }}/.edge-custom-config.yaml"
        state: absent
      when: kairos_edge_custom_config | default('') | length == 0

    # Self-install images carry their config INSIDE the ISO: CanvOS ships
    # CanvOS/user-data as files-iso/config.yaml, which the image installer
    # reads on boot. The CIDATA path further down is the edge mechanism and is
    # not used in that mode.
    - name: Bake the cloud-config into the ISO (self-install images)
      ansible.builtin.template:
        src: "{{ kairos_cloud_config_template }}"
        dest: "{{ canvos_dir }}/user-data"
        mode: "0644"
      when: kairos_build_self_install | default(false) | bool

    # All profiles share one CanvOS checkout and CanvOS bakes user-data into
    # EVERY ISO as files-iso/config.yaml. A `when:`-guard alone therefore leaks:
    # after an appliance build, the next edge build inherits the APPLIANCE
    # cloud-config in its ISO. Remove it explicitly, the same way the
    # Dockerfile blocks and .edge-custom-config.yaml are handled.
    - name: Remove a user-data left by a self-install profile
      ansible.builtin.file:
        path: "{{ canvos_dir }}/user-data"
        state: absent
      when: not (kairos_build_self_install | default(false) | bool)

    - name: Run CanvOS build (day-1 — build ISO)
      ansible.builtin.shell: |
        cd {{ canvos_dir }}
        ./earthly.sh +iso --ARCH={{ arch }}
      async: 3600
      poll: 30
      when: kairos_build_raw_disk | default(true) | bool

    # ---- Day-2 runs as TWO phases so a failed UPLOAD never costs a rebuild ----
    # `SAVE IMAGE --push` only marks the image; the push executes only when the
    # CLI is given `--push`. So WITHOUT `--push` phase 1 LOADS the image into the
    # local Docker daemon and never touches the registry: it cannot fail on a
    # flaky upload, and it leaves the image behind for a retry. Phase 2 is the
    # only step that talks to the registry, and it is retried.
    # Why: 2026-09-28 two day-2 runs reached "100% exporting outputs" and then
    # died in POST /v2/ubuntu/blobs/uploads/ with a header timeout, leaving
    # nothing local to retry from.
    - name: Derive the provider-image refs the day-2 push would address
      ansible.builtin.shell: |
        python3 - <<'PY'
        import json, re, sys
        d = "{{ canvos_dir }}"
        a = {}
        for l in open(d + "/.arg"):
            l = l.strip()
            if not l or l.startswith("#") or "=" not in l:
                continue
            k, v = l.split("=", 1)
            a[k.strip()] = v.strip()
        m = re.search(r"(?m)^\s*ARG\s+PE_VERSION=(\S+)", open(d + "/Earthfile").read())
        if not m:
            sys.exit(0)
        try:
            matrix = json.load(open(d + "/k8s_version.json"))
        except Exception:
            sys.exit(0)
        for dist, versions in matrix.items():
            for v in versions:
                print("%s/%s:%s-%s-%s-%s" % (a["IMAGE_REGISTRY"], a["IMAGE_REPO"],
                                              dist, v, m.group(1), a["CUSTOM_TAG"]))
        PY
      register: kairos_provider_refs
      changed_when: false
      failed_when: false
      when: not (kairos_build_raw_disk | default(true) | bool)

    - name: Stat the expected provider image in the local Docker daemon
      ansible.builtin.command: docker image inspect {{ item }}
      loop: "{{ kairos_provider_refs.stdout_lines | default([]) }}"
      register: kairos_provider_local
      changed_when: false
      failed_when: false
      when: not (kairos_build_raw_disk | default(true) | bool)

    # Read BEFORE it is consumed below -- the stamp is the guard against a tag
    # that exists locally but was built from older inputs.
    - name: Read the recorded provider-image build-input stamp
      ansible.builtin.command: cat {{ build_dir }}/.provider-image-stamp-{{ kairos_profile }}
      register: kairos_image_stamp_rec
      changed_when: false
      failed_when: false
      when: not (kairos_build_raw_disk | default(true) | bool)

    - name: Decide whether a local provider image matches the current build inputs
      ansible.builtin.set_fact:
        kairos_provider_cached: >-
          {{ (kairos_provider_refs.stdout_lines | default([]) | length > 0)
             and ((kairos_provider_local.results | default([])
                   | selectattr('rc', 'defined') | selectattr('rc', 'equalto', 0) | list | length)
                  == (kairos_provider_refs.stdout_lines | default([]) | length))
             and ((kairos_image_stamp_rec.stdout | default('') | trim)
                  == (kairos_iso_stamp.stdout | trim)) }}
      when: not (kairos_build_raw_disk | default(true) | bool)

    - name: Decide whether this run builds or uploads only
      ansible.builtin.set_fact:
        kairos_upload_only: "{{ (kairos_image_upload_only | default(false) | bool) or (kairos_provider_cached | default(false) | bool) }}"
      when: not (kairos_build_raw_disk | default(true) | bool)

    - name: Assert an image is actually built when upload-only was forced
      ansible.builtin.assert:
        that:
          - kairos_provider_refs.stdout_lines | default([]) | length > 0
          - (kairos_provider_local.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'equalto', 0) | list | length) > 0
        fail_msg: >-
          kairos_image_upload_only=true but no local provider image matches the
          expected refs {{ kairos_provider_refs.stdout_lines | default([]) | join(', ') }}.
          Run `make kairos-image` to build it first.
      when:
        - not (kairos_build_raw_disk | default(true) | bool)
        - kairos_image_upload_only | default(false) | bool

    - name: Run CanvOS build (day-2 phase 1 -- build + LOAD, no registry traffic)
      ansible.builtin.shell: |
        cd {{ canvos_dir }}
        ./earthly.sh +build-provider-images --ARCH={{ arch }}
      async: 3600
      poll: 30
      when:
        - not (kairos_build_raw_disk | default(true) | bool)
        - not (kairos_upload_only | default(false) | bool)

    - name: Record the provider-image build-input stamp
      ansible.builtin.copy:
        content: "{{ kairos_iso_stamp.stdout }}\n"
        dest: "{{ build_dir }}/.provider-image-stamp-{{ kairos_profile }}"
        mode: "0644"
      when:
        - not (kairos_build_raw_disk | default(true) | bool)
        - not (kairos_upload_only | default(false) | bool)

    - name: Upload the provider images (day-2 phase 2 -- retried, blob-resumed)
      ansible.builtin.shell: |
        # NOTE: runs under /bin/sh (dash) -- no `set -o pipefail` here; there is
        # no pipeline, and dash rejects the bash-ism (killed the push in 4ms on
        # 2026-09-28 with "/bin/sh: 1: set: Illegal option -o pipefail").
        rc=0
        for ref in {{ kairos_provider_refs.stdout_lines | default([]) | join(' ') }}; do
          echo "== pushing $ref"
          ok=0
          for i in $(seq 1 {{ kairos_upload_attempts | default(3) }}); do
            if timeout {{ kairos_upload_timeout | default(1800) }} docker push "$ref"; then
              ok=1; break
            fi
            echo "!! push attempt $i for $ref failed; retrying" >&2
          done
          [ "$ok" = 1 ] || { echo "!! giving up on $ref" >&2; rc=1; }
        done
        exit $rc
      when: not (kairos_build_raw_disk | default(true) | bool)

    - name: Copy ISO to build directory
      ansible.builtin.copy:
        src: "{{ canvos_dir }}/build/{{ iso_name }}.iso"
        dest: "{{ build_dir }}/{{ iso_name }}.iso"
        remote_src: true
      when: kairos_build_raw_disk | default(true) | bool

    - name: Record the ISO build-input stamp
      ansible.builtin.copy:
        content: "{{ kairos_iso_stamp.stdout }}\n"
        dest: "{{ build_dir }}/.iso-stamp-{{ kairos_profile }}"
        mode: "0644"
      when: kairos_build_raw_disk | default(true) | bool

# ---- Generate raw disk image ----

# Stamp the raw build's INPUTS the same way the ISO is stamped. The raw's own
# short-circuit below reuses a cached .raw whenever the file merely exists, and
# the bootargs patch, the finalize and the mdraid assertion all live INSIDE that
# block -- so a template or profile edit is inert on any host that already has a
# raw: it never reaches the dd'd image. The stamp combines the ISO's inputs
# (roles, profiles, inventory, cloud-config) with the ISO bytes themselves: a
# cloud-config change moves the inputs but not the installed payload, while a
# CanvOS bump moves the payload but not the inputs, so neither alone suffices.
- name: Compute the raw-disk build-input stamp
  ansible.builtin.shell: |
    set -eu
    iso=$(sha256sum {{ build_dir }}/{{ iso_name }}.iso | awk '{print $1}')
    printf '%s %s\n' '{{ kairos_iso_stamp.stdout }}' "$iso" | sha256sum | awk '{print $1}'
  register: kairos_raw_stamp
  changed_when: false
  when: kairos_build_raw_disk | default(true) | bool

- name: Read the recorded raw-disk build-input stamp
  ansible.builtin.command: cat {{ build_dir }}/.raw-stamp-{{ kairos_profile }}
  register: kairos_raw_stamp_rec
  changed_when: false
  failed_when: false
  when: kairos_build_raw_disk | default(true) | bool

- name: Check if raw disk exists
  ansible.builtin.stat:
    path: "{{ raw_disk_path }}"
  register: raw_disk_stat

- name: Generate raw disk image via QEMU
  when:
    - kairos_build_raw_disk | default(true) | bool
    - (not raw_disk_stat.stat.exists)
      or ((kairos_raw_stamp_rec.stdout | default('')) != (kairos_raw_stamp.stdout | default('')))
  block:
    - name: Generate BCM SSH key pair if missing
      ansible.builtin.shell: |
        if [ ! -f {{ build_dir }}/bcm-kairos-key ]; then
          ssh-keygen -t ed25519 -f {{ build_dir }}/bcm-kairos-key -N "" -C "kairos-node@bcm" -q
          echo "generated"
        else
          echo "exists"
        fi
      register: bcm_key_gen

    - name: Read BCM SSH key
      ansible.builtin.slurp:
        src: "{{ build_dir }}/bcm-kairos-key"
      register: bcm_key_file

    - name: Set BCM SSH key content
      ansible.builtin.set_fact:
        bcm_ssh_key_content: "{{ bcm_key_file.content | b64decode }}"

    # A plaintext value here renders a scalar entities cannot use and the
    # account comes up locked — the defect this shape exists to remove.
    - name: Assert the kairos password hash is a usable crypt hash
      ansible.builtin.assert:
        that:
          - kairos_user_password_hash | default('') | length > 30
          - kairos_user_password_hash is match('^\$[0-9a-z]{1,2}\$')
        fail_msg: "kairos_user_password_hash must be a crypt hash (e.g. $6$... or $y$...), not a plaintext password."
      when: kairos_build_raw_disk | default(true) | bool

    - name: Render cloud-config
      # Template is profile-selectable (kairos_cloud_config_template) so a
      # profile can build a non-edge image — e.g. the Palette appliance —
      # through this same pipeline. Default is unchanged for every profile.
      ansible.builtin.template:
        src: "{{ kairos_cloud_config_template }}"
        dest: "{{ build_dir }}/cloud-config.yaml"
        mode: "0644"

    - name: Validate the rendered cloud-config
      # A stage key with nothing under it is YAML null, and kairos-agent
      # segfaults merging it rather than reporting a config error -- the
      # symptom is a blank disk and "no EFI System Partition found" from the
      # verify step, minutes later. Fail here, naming the key.
      ansible.builtin.command:
        argv:
          - python3
          - "{{ role_path }}/files/check-cloud-config.py"
          - "{{ build_dir }}/cloud-config.yaml"
      changed_when: false

    # Gate the artifact: a plaintext passwd renders a value the account cannot use.
    - name: Read the rendered cloud-config
      ansible.builtin.slurp:
        src: "{{ build_dir }}/cloud-config.yaml"
      register: cc_rendered
      when: kairos_build_raw_disk | default(true) | bool

    - name: Assert the rendered cloud-config carries the hash and no plaintext password
      ansible.builtin.assert:
        that:
          - kairos_user_password_hash in (cc_rendered.content | b64decode)
          - "'passwd: kairos' not in (cc_rendered.content | b64decode)"
        fail_msg: "The rendered cloud-config must carry kairos_user_password_hash; a plaintext passwd cannot be used by the account."
      when: kairos_build_raw_disk | default(true) | bool

    # User-supplied additional cloud-config YAML, layered into /oem/99_userdata.yaml.
    # Only written when kairos_user_data is non-empty; the FAT32 image and the
    # nc-over-serial cp commands check for the file's presence before acting.
    - name: Write user extra-userdata.yaml (when kairos_user_data is set)
      ansible.builtin.copy:
        content: "{{ kairos_user_data }}"
        dest: "{{ build_dir }}/extra-userdata.yaml"
        mode: "0644"
      when: kairos_user_data | default('') | length > 0

    - name: Remove stale extra-userdata.yaml (when kairos_user_data is unset)
      ansible.builtin.file:
        path: "{{ build_dir }}/extra-userdata.yaml"
        state: absent
      when: kairos_user_data | default('') | length == 0

    - name: Create user-data FAT32 image
      ansible.builtin.shell: |
        dd if=/dev/zero of={{ build_dir }}/userdata.img bs=1M count=4 status=none
        mkfs.vfat -n CIDATA {{ build_dir }}/userdata.img >/dev/null
        mcopy -i {{ build_dir }}/userdata.img {{ build_dir }}/cloud-config.yaml "::user-data"
        if [ -f {{ build_dir }}/extra-userdata.yaml ]; then
          mcopy -i {{ build_dir }}/userdata.img {{ build_dir }}/extra-userdata.yaml "::extra-userdata"
        fi

    - name: Create blank raw disk
      ansible.builtin.shell: truncate -s {{ kairos_raw_disk_size }} {{ raw_disk_path }}

    # Fail loudly BEFORE the install if the accelerator or firmware is missing.
    # A qemu that cannot start writes no pidfile, and the install task below then
    # leaves a blank raw that the verify step only notices minutes later.
    - name: Assert the QEMU accelerator and OVMF firmware are usable
      ansible.builtin.shell: |
        set -eu
        accel="{{ kairos_build_qemu_accel }}"
        case "$accel" in
          kvm)
            [ -e /dev/kvm ] || { echo "FATAL: kairos_build_qemu_accel=kvm but /dev/kvm is absent: no hardware virtualisation on this host (nested guest without VMX/AMD-V, or the kvm module is not loaded). Build on a KVM-capable host, or set kairos_build_qemu_accel=tcg." >&2; exit 1; }
            { [ -r /dev/kvm ] && [ -w /dev/kvm ]; } || { echo "FATAL: /dev/kvm exists but is not rw for uid $(id -u)." >&2; exit 1; }
            ;;
          tcg) : ;;
          *) echo "FATAL: unknown kairos_build_qemu_accel '${accel}' (expected kvm or tcg)." >&2; exit 1 ;;
        esac
        for f in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/qemu/OVMF.fd /usr/share/ovmf/OVMF.fd; do
          [ -f "$f" ] && { echo "accel=$accel firmware=$f OK"; exit 0; }
        done
        echo "FATAL: no OVMF firmware found (looked for OVMF_CODE_4M.fd, qemu/OVMF.fd, ovmf/OVMF.fd). Install the ovmf package." >&2
        exit 1
      changed_when: false

    # OVMF (UEFI) so kairos-agent detects UEFI and installs GRUB-EFI into an ESP.
    # The resulting raw image is bootable on UEFI hardware (physical Dell servers etc.).
    # BIOS-only platforms would need a separate image built with SeaBIOS.
    - name: Run kairos-agent install in QEMU (OVMF / UEFI)
      when: not (kairos_build_self_install | default(false) | bool)
      ansible.builtin.shell: |
        SOCK="{{ build_dir }}/.qemu-install.sock"
        rm -f "$SOCK"
        OVMF_CODE=/usr/share/OVMF/OVMF_CODE_4M.fd
        OVMF_VARS_SRC=/usr/share/OVMF/OVMF_VARS_4M.fd
        [ -f "$OVMF_CODE" ] || OVMF_CODE=/usr/share/qemu/OVMF.fd
        [ -f "$OVMF_VARS_SRC" ] || OVMF_VARS_SRC=/usr/share/ovmf/OVMF.fd
        cp -f "$OVMF_VARS_SRC" {{ build_dir }}/ovmf-vars.fd
        # kvm = hardware acceleration; tcg = pure emulation with no /dev/kvm.
        if [ "{{ kairos_build_qemu_accel }}" = kvm ]; then
          ACCEL="-enable-kvm -cpu host"
        else
          ACCEL="-accel tcg -cpu max"
        fi
        qemu-system-x86_64 \
          $ACCEL -m 4096 -smp 2 \
          -machine q35 \
          -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
          -drive if=pflash,format=raw,file={{ build_dir }}/ovmf-vars.fd \
          -display none \
          -chardev socket,id=ser0,path="$SOCK",server=on,wait=off \
          -serial chardev:ser0 \
          -drive if=virtio,format=raw,media=disk,file={{ raw_disk_path }} \
          -drive if=virtio,format=raw,readonly=on,file={{ build_dir }}/userdata.img \
          -drive format=raw,media=cdrom,readonly=on,file={{ build_dir }}/{{ iso_name }}.iso \
          -boot d \
          -pidfile {{ build_dir }}/.qemu-install.pid \
          -D {{ build_dir }}/qemu-debug.log \
          -daemonize 2>{{ build_dir }}/qemu-start.log
        QEMU_PID=$(cat {{ build_dir }}/.qemu-install.pid 2>/dev/null || true)
        # A qemu that cannot start writes no pidfile; without this check the wait
        # loop below falls through on an empty PID and the task reports SUCCESS,
        # leaving a blank raw that only the verify task notices minutes later.
        if [ -z "$QEMU_PID" ] || ! kill -0 "$QEMU_PID" 2>/dev/null; then
          echo "FATAL: QEMU failed to start (no live pid in .qemu-install.pid). qemu stderr:" >&2
          cat {{ build_dir }}/qemu-start.log >&2 2>/dev/null || true
          exit 1
        fi
        INSTALL_LOG={{ e2e_dir }}/logs/qemu-install.log
        : > "$INSTALL_LOG"
        (
          # Wait for the installer shell prompt on the serial console before
          # injecting anything. Boot time varies by base/OS_VERSION; a blind sleep
          # too short drops the config-copy command, so kairos-agent then
          # installs with NO config and falls into Palette pairing — producing an
          # EMPTY disk. Poll the serial log nc is writing for the root prompt.
          for i in $(seq 1 90); do
            grep -qaE 'root@[A-Za-z0-9._-]+:[^#]*#' "$INSTALL_LOG" 2>/dev/null && break
            sleep 5
          done
          sleep 3
          # Mount the CIDATA user-data disk and copy the base cloud-config to
          # /oem/90_custom.yaml. Robust against installer-env differences: ensure
          # the mountpoints exist and fall back to explicit vfat / LABEL mounts.
          # Retry until the node echoes the marker — the CFG""DONE quote-split means
          # the COMMAND echo (CFG""DONE) differs from the OUTPUT (CFGDONE), so grep
          # only matches a real success. Without a confirmed copy kairos-agent has
          # no install config and pairs instead of installing.
          for i in $(seq 1 15); do
            printf 'mkdir -p /mnt /oem; mount /dev/vdb /mnt 2>/dev/null || mount -t vfat /dev/vdb /mnt 2>/dev/null || mount -t vfat LABEL=CIDATA /mnt 2>/dev/null; cp /mnt/user-data /oem/90_custom.yaml && cp /mnt/user-data /tmp/99_bcm.yaml && { [ -f /mnt/extra-userdata ] && cp /mnt/extra-userdata /tmp/99_userdata.yaml; true; } && echo CFG""DONE\r\n'
            sleep 4
            grep -qa 'CFGDONE' "$INSTALL_LOG" 2>/dev/null && break
          done
          sleep 2
          # kairos-agent install with teardown + retry. teardown ALSO deactivates
          # LVM/device-mapper: an image that ships lvm2 (profiles/palette-appliance.yml
          # needs it for Piraeus/LINSTOR) starts LVM2 monitoring in the LIVE
          # installer env, which holds the target disk. The blkdeactivate that
          # kairos-agent runs then fails with "device or resource busy" on every
          # retry and the install writes nothing. Guarded on the binaries being
          # present so images without lvm2 are unaffected.
          #
          # It also stops the STYLUS side. An appliance/stylus image boots its
          # own installer in the live env, whose config runs
          # "palette-agent partitions unlock-all" - that opens the target disk
          # exclusively, so the injected kairos-agent install can never claim
          # it. A plain Kairos edge image ships no such agent, which is why
          # this only appears for appliance profiles. VDA-HOLDERS in the
          # console log names whatever still holds the disk after a teardown.
          # NOTE: no apostrophes in this block — an odd number of single quotes
          # anywhere in this shell body breaks Ansible argument splitting.
          #
          # After it partitions the blank disk, the live env races to auto-unlock+mount the new COS_*
          # partitions (LUKS -> /dev/mapper/persistent|oem, mounted at /run/cos/*,
          # /usr/local, /oem), and the deploy step then aborts with "target device
          # /dev/vda has mounted partitions". teardown() unmounts those (lazy),
          # closes the LUKS mappers, and wipes the table; we retry up to 3x since
          # the race does not fire on every attempt. Then re-mount the new OEM
          # partition and drop in 99_bcm.yaml and (if present) 99_userdata.yaml.
          printf 'teardown() { sync; systemctl stop stylus-agent 2>/dev/null || true; pkill -9 -f palette-agent 2>/dev/null || true; pkill -9 -f palette-tui 2>/dev/null || true; pkill -9 -f agent-provider-stylus 2>/dev/null || true; sleep 2; for mp in $(grep -E " (/run/cos|/oem|/usr/local)" /proc/mounts | cut -d" " -f2 | sort -r); do umount -l "$mp" 2>/dev/null || true; done; for d in persistent oem state recovery; do [ -e /dev/mapper/$d ] && cryptsetup close /dev/mapper/$d 2>/dev/null || true; done; command -v vgchange >/dev/null 2>&1 && { vgchange -an 2>/dev/null || true; }; command -v dmsetup >/dev/null 2>&1 && { dmsetup remove_all --force 2>/dev/null || true; }; command -v blkdeactivate >/dev/null 2>&1 && { blkdeactivate --dmoptions force,retry /dev/vda 2>/dev/null || true; }; udevadm settle 2>/dev/null || true; wipefs -a /dev/vda 2>/dev/null || true; sgdisk --zap-all /dev/vda 2>/dev/null || true; partprobe /dev/vda 2>/dev/null || true; command -v fuser >/dev/null 2>&1 && { echo VDA-HOLDERS-BEGIN; fuser -vm /dev/vda 2>&1 | head -12; echo VDA-HOLDERS-END; }; }; n=1; while true; do teardown; kairos-agent --debug install 2>&1 && break; n=$((n+1)); [ "$n" -gt 3 ] && break; echo INSTALL-RETRY-$n; sleep 5; done; mount /dev/vda2 /oem 2>/dev/null; cp /tmp/99_bcm.yaml /oem/99_bcm.yaml; { [ -f /tmp/99_userdata.yaml ] && cp /tmp/99_userdata.yaml /oem/99_userdata.yaml; true; }; poweroff\r\n'
          sleep 900
        ) | nc -U "$SOCK" > "$INSTALL_LOG" 2>&1 &
        SERIAL_PID=$!
        while kill -0 "$QEMU_PID" 2>/dev/null; do sleep 10; done
        kill "$SERIAL_PID" 2>/dev/null || true
        rm -f "$SOCK" {{ build_dir }}/.qemu-install.pid {{ build_dir }}/userdata.img
      async: 3600
      poll: 30

    # Self-install: no serial injection at all. The image boots its own
    # installer, reads the config baked into the ISO, installs, and powers
    # itself off (install.poweroff). Waiting for the QEMU process to exit is
    # the completion signal, the same one roles/bcm_vm uses.
    - name: Let the image install itself in QEMU (OVMF / UEFI, self-install)
      when: kairos_build_self_install | default(false) | bool
      ansible.builtin.shell: |
        OVMF_CODE=/usr/share/OVMF/OVMF_CODE_4M.fd
        OVMF_VARS_SRC=/usr/share/OVMF/OVMF_VARS_4M.fd
        [ -f "$OVMF_CODE" ] || OVMF_CODE=/usr/share/qemu/OVMF.fd
        [ -f "$OVMF_VARS_SRC" ] || OVMF_VARS_SRC=/usr/share/ovmf/OVMF.fd
        cp -f "$OVMF_VARS_SRC" {{ build_dir }}/ovmf-vars.fd
        INSTALL_LOG={{ e2e_dir }}/logs/qemu-install.log
        : > "$INSTALL_LOG"
        qemu-system-x86_64 \
          -enable-kvm -m {{ kairos_build_install_ram | default(8192) }} -smp {{ kairos_build_install_cpus | default(4) }} -cpu host \
          -machine q35 \
          -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
          -drive if=pflash,format=raw,file={{ build_dir }}/ovmf-vars.fd \
          -display none \
          -serial file:"$INSTALL_LOG" \
          -drive if=virtio,format=raw,media=disk,file={{ raw_disk_path }} \
          -drive format=raw,media=cdrom,readonly=on,file={{ build_dir }}/{{ iso_name }}.iso \
          -boot d \
          -no-reboot \
          -pidfile {{ build_dir }}/.qemu-install.pid \
          -daemonize
        QEMU_PID=$(cat {{ build_dir }}/.qemu-install.pid)
        echo "self-install running (PID $QEMU_PID); powers off when done"
        T=0
        LIMIT={{ kairos_build_install_timeout | default(3600) }}
        while kill -0 "$QEMU_PID" 2>/dev/null; do
          sleep 15
          T=$((T + 15))
          if [ "$T" -ge "$LIMIT" ]; then
            echo "TIMEOUT after ${T}s, see $INSTALL_LOG" >&2
            kill "$QEMU_PID" 2>/dev/null || true
            exit 1
          fi
        done
        echo "self-install finished after ${T}s"
        rm -f {{ build_dir }}/.qemu-install.pid
      async: "{{ (kairos_build_install_timeout | default(3600) | int) + 300 }}"
      poll: 30

    - name: Verify kairos-agent install produced a bootable disk
      # The QEMU install step cannot surface kairos-agent's exit code — it only
      # waits for the VM to power off, and a FAILED install powers off cleanly
      # too. A failed install leaves an empty ESP and a near-empty active.img,
      # which the firmware reports as "Failed to boot Kairos". Assert the install
      # actually produced a bootloader + a real rootfs so the build fails here
      # instead of silently shipping an unbootable image to deploy-dd.
      ansible.builtin.shell: |
        set -eu
        LOOP=$(losetup -fP --show {{ raw_disk_path }})
        # losetup -fP asks the kernel to scan the partition table, but the
        # /dev/loopNpM nodes are created asynchronously by udev. Globbing them
        # immediately can match nothing on a busy box, and the checks below
        # then report "no EFI System Partition (vfat) found" and
        # "cOS/active.img not found" for a perfectly good image -- the SAME
        # message a genuinely failed install produces, which makes a false
        # negative here expensive to tell apart from the real thing. Wait for
        # the nodes before looking.
        partprobe "$LOOP" 2> /dev/null || true
        udevadm settle --timeout=30 2> /dev/null || true
        for _ in $(seq 1 20); do
          ls ${LOOP}p1 > /dev/null 2>&1 && break
          sleep 1
        done
        cleanup() {
          umount /tmp/kairos-verify-esp 2>/dev/null || true
          umount /tmp/kairos-verify-state 2>/dev/null || true
          losetup -d "$LOOP" 2>/dev/null || true
          rmdir /tmp/kairos-verify-esp /tmp/kairos-verify-state 2>/dev/null || true
        }
        trap cleanup EXIT
        mkdir -p /tmp/kairos-verify-esp /tmp/kairos-verify-state
        errs=()

        # 1) The ESP must carry a GRUB EFI binary. Its absence is exactly the
        #    firmware "Failed to boot" case — nothing for the firmware to launch.
        ESP=""
        for p in "${LOOP}"p*; do
          [ -b "$p" ] || continue
          [ "$(blkid -p -o value -s TYPE "$p" 2>/dev/null)" = vfat ] && { ESP="$p"; break; }
        done
        if [ -z "$ESP" ]; then
          errs+=("[no EFI System Partition (vfat) found]")
        else
          mount -o ro "$ESP" /tmp/kairos-verify-esp
          find /tmp/kairos-verify-esp -iname '*.efi' | grep -q . \
            || errs+=("[ESP has no .efi bootloader — GRUB not installed]")
          umount /tmp/kairos-verify-esp
        fi

        # 2) active.img must hold a real rootfs. A failed deploy leaves it nearly
        #    empty (~255MB observed) vs multi-GB for a good install; require >1GiB.
        found_active=0
        for p in "${LOOP}"p*; do
          [ -b "$p" ] || continue
          case "$(blkid -p -o value -s TYPE "$p" 2>/dev/null)" in ext2|ext3|ext4) ;; *) continue ;; esac
          mount -o ro "$p" /tmp/kairos-verify-state 2>/dev/null || continue
          if [ -f /tmp/kairos-verify-state/cOS/active.img ]; then
            found_active=1
            used_kb=$(du -sk /tmp/kairos-verify-state/cOS/active.img | awk '{print $1}')
            [ "${used_kb:-0}" -ge 1048576 ] \
              || errs+=("[cOS/active.img only ${used_kb}KB written — deploy incomplete]")
            umount /tmp/kairos-verify-state
            break
          fi
          umount /tmp/kairos-verify-state
        done
        [ "$found_active" = 1 ] || errs+=("[cOS/active.img not found on any partition]")

        # Test emptiness via the array-expansion form below, NOT the array-length
        # form: a literal brace-hash sequence reads as a Jinja comment-start here
        # and breaks the task at parse time.
        if [ -n "${errs[*]:-}" ]; then
          echo "kairos-agent install verification FAILED: ${errs[*]}" >&2
          echo "Inspect {{ e2e_dir }}/logs/qemu-install.log for the installer output." >&2
          echo "An empty qemu-install.log means the VM never booted: see {{ build_dir }}/qemu-start.log for qemu's stderr." >&2
          exit 1
        fi
        echo "install verification OK — ESP has a bootloader and active.img is populated"
      args:
        # Runs bash (not the default /bin/sh = dash) — the error list uses a bash array.
        executable: /bin/bash
      become: true
      changed_when: false

    - name: Fix ext4 features for GRUB compatibility (outer partitions)
      ansible.builtin.shell: |
        # GRUB cannot read ext4 filesystems with checksum/orphan-file features.
        # 24.04+/26.04 base images ship e2fsprogs >= 1.47, which enables
        # orphan_file AND metadata_csum_seed by default; metadata_csum cannot be
        # cleared while metadata_csum_seed is set, so clear them together (seed
        # before csum). NOTE: 2>/dev/null was removed deliberately — on 24.04 the
        # old `tune2fs -O ^metadata_csum` silently failed and the node never booted.
        LOOP=$(losetup -fP --show {{ raw_disk_path }})
        # Same udev race as the verify step above.
        partprobe "$LOOP" 2> /dev/null || true
        udevadm settle --timeout=30 2> /dev/null || true
        for p in ${LOOP}p2 ${LOOP}p3 ${LOOP}p4 ${LOOP}p5; do
          [ -b "$p" ] || continue
          e2fsck -fy "$p" >/dev/null 2>&1 || true
          if tune2fs -O ^orphan_file,^metadata_csum_seed,^metadata_csum "$p"; then
            echo "Stripped ext4 feats: $p"
          else
            echo "WARN: ext4 feature-strip failed on $p"
          fi
        done
        losetup -d "$LOOP"
      become: true

    - name: Patch bootargs and network config for stable interface naming
      ansible.builtin.shell: |
        LOOP=$(losetup -fP --show {{ raw_disk_path }})
        mkdir -p /tmp/kairos-patch-state /tmp/kairos-patch-img
        for part_label in p4:cOS/active.img p4:cOS/passive.img p3:cOS/recovery.img; do
          PART="${LOOP}${part_label%%:*}"
          IMG="${part_label#*:}"
          [ -b "$PART" ] || continue
          mount "$PART" /tmp/kairos-patch-state 2>/dev/null || continue
          [ -f "/tmp/kairos-patch-state/$IMG" ] || { umount /tmp/kairos-patch-state; continue; }
          IMG_LOOP=$(losetup -f --show "/tmp/kairos-patch-state/$IMG")
          mount "$IMG_LOOP" /tmp/kairos-patch-img 2>/dev/null || { losetup -d "$IMG_LOOP"; umount /tmp/kairos-patch-state; continue; }
          if [ -f /tmp/kairos-patch-img/etc/cos/bootargs.cfg ]; then
            # rd.auto=1 (kairos_build_mdraid) makes dracut scan+assemble md arrays
            # before the root pivot, so COS_STATE on /dev/md0 is found at boot.
            sed -i 's/net.ifnames=1/net.ifnames=0 biosdevname=0{{ " rd.auto=1" if (kairos_build_mdraid | default(false) | bool) else "" }}/' /tmp/kairos-patch-img/etc/cos/bootargs.cfg
            echo "Patched bootargs in $IMG"
          fi
          if [ -d /tmp/kairos-patch-img/etc/network/interfaces.d ] && [ ! -f /tmp/kairos-patch-img/etc/network/interfaces.d/ifcfg-eth0 ]; then
            printf 'auto eth0\niface eth0 inet dhcp\n' > /tmp/kairos-patch-img/etc/network/interfaces.d/ifcfg-eth0
            echo "Added ifcfg-eth0 in $IMG"
          fi
          umount /tmp/kairos-patch-img
          # GRUB reads the kernel from inside these cOS images, so strip the same
          # ext4 features here too (24.04+/26.04 e2fsprogs enables them by default).
          e2fsck -fy "$IMG_LOOP" >/dev/null 2>&1 || true
          if tune2fs -O ^orphan_file,^metadata_csum_seed,^metadata_csum "$IMG_LOOP"; then
            echo "Stripped ext4 feats in $IMG"
          else
            echo "WARN: ext4 feature-strip failed in $IMG"
          fi
          losetup -d "$IMG_LOOP"
          umount /tmp/kairos-patch-state
        done
        losetup -d "$LOOP"
        rmdir /tmp/kairos-patch-state /tmp/kairos-patch-img 2>/dev/null || true
      become: true

    - name: Set GRUB timeout for unattended boot
      ansible.builtin.shell: |
        LOOP=$(losetup -fP --show {{ raw_disk_path }})
        mkdir -p /tmp/kairos-patch-grub
        # Partition 1 is the BIOS boot/grub partition
        for p in ${LOOP}p1 ${LOOP}p2; do
          mount "$p" /tmp/kairos-patch-grub 2>/dev/null || continue
          if [ -f /tmp/kairos-patch-grub/grub2/grub.cfg ]; then
            sed -i 's/^set timeout=.*/set timeout=5/' /tmp/kairos-patch-grub/grub2/grub.cfg
            grep -q "^set timeout=" /tmp/kairos-patch-grub/grub2/grub.cfg || \
              sed -i '1i set timeout=5' /tmp/kairos-patch-grub/grub2/grub.cfg
            echo "Patched grub timeout in $p (grub2/grub.cfg)"
          fi
          if [ -f /tmp/kairos-patch-grub/grub/grub.cfg ]; then
            sed -i 's/^set timeout=.*/set timeout=5/' /tmp/kairos-patch-grub/grub/grub.cfg
            grep -q "^set timeout=" /tmp/kairos-patch-grub/grub/grub.cfg || \
              sed -i '1i set timeout=5' /tmp/kairos-patch-grub/grub/grub.cfg
            echo "Patched grub timeout in $p (grub/grub.cfg)"
          fi
          umount /tmp/kairos-patch-grub
        done
        losetup -d "$LOOP"
        rmdir /tmp/kairos-patch-grub 2>/dev/null || true
      become: true

    # When building the RAID-capable image, assert the load-bearing outputs
    # actually landed — otherwise the failure only surfaces as a dracut
    # emergency shell on the real node, after a full deploy. Checks the mdadm
    # binary is in the rootfs (dracut sources the initramfs copy from here), the
    # initramfs carries the mdraid module AND the pinned ARRAY line -- parsed
    # from the initrd directly, since lsinitrd is not installed here -- and
    # rd.auto is on the kernel cmdline. No-op unless kairos_build_mdraid is true.
    - name: Assert mdraid capability landed in the built image (kairos_build_mdraid)
      when: kairos_build_mdraid | default(false) | bool
      become: true
      changed_when: false
      args:
        executable: /bin/bash
      ansible.builtin.shell: |
        set -eu
        LOOP=$(losetup -fP --show {{ raw_disk_path }})
        cleanup() {
          umount /tmp/kairos-mdraid-img 2>/dev/null || true
          umount /tmp/kairos-mdraid-state 2>/dev/null || true
          losetup -d "$LOOP" 2>/dev/null || true
          rmdir /tmp/kairos-mdraid-img /tmp/kairos-mdraid-state 2>/dev/null || true
        }
        trap cleanup EXIT
        mkdir -p /tmp/kairos-mdraid-state /tmp/kairos-mdraid-img
        errs=()
        mounted=0
        for p in ${LOOP}p4 ${LOOP}p3 ${LOOP}p2; do
          [ -b "$p" ] || continue
          mount "$p" /tmp/kairos-mdraid-state 2>/dev/null || continue
          IMG=""
          for cand in cOS/active.img cOS/recovery.img cOS/passive.img; do
            [ -f "/tmp/kairos-mdraid-state/$cand" ] && { IMG="/tmp/kairos-mdraid-state/$cand"; break; }
          done
          [ -n "$IMG" ] || { umount /tmp/kairos-mdraid-state; continue; }
          IMG_LOOP=$(losetup -f --show "$IMG")
          if mount "$IMG_LOOP" /tmp/kairos-mdraid-img 2>/dev/null; then
            mounted=1
            R=/tmp/kairos-mdraid-img
            { [ -e "$R/usr/sbin/mdadm" ] || [ -e "$R/sbin/mdadm" ] || [ -e "$R/usr/bin/mdadm" ]; } \
              || errs+=("[mdadm binary not found in image rootfs]")
            # The ARRAY line must be in the ROOTFS mdadm.conf AND inside the
            # initramfs -- dracut reads /etc/mdadm.conf from the initrd at boot.
            # Without it auto-assembly names the array md127 (homehost mismatch),
            # so the finalize dd target /dev/md0 and the stage-6 checks find
            # nothing. A rootfs-only write silently passes a rootfs-only check.
            grep -q '^ARRAY /dev/md0' "$R/etc/mdadm/mdadm.conf" 2>/dev/null \
              || errs+=("[no ARRAY /dev/md0 line in rootfs mdadm.conf]")
            # Presence of the ARRAY line is not enough -- mdadm must ACCEPT it.
            # `homehost=` on that line makes mdadm discard the whole line, which
            # is how a passing build shipped an image whose array came up md127.
            grep -q '^HOMEHOST' "$R/etc/mdadm/mdadm.conf" 2>/dev/null \
              || errs+=("[no HOMEHOST directive in rootfs mdadm.conf]")
            grep -q 'homehost=' "$R/etc/mdadm/mdadm.conf" 2>/dev/null \
              && errs+=("[homehost= on an ARRAY line -- mdadm rejects the line; use a top-level HOMEHOST]")
            # Check the initramfs directly. lsinitrd is not installed on this
            # host, and gating the check on it is exactly how a missing
            # mdadm.conf once survived a passing build -- so this runs
            # unconditionally and parses the initrd itself (early cpio followed
            # by an xz/gzip/bzip2/zstd main cpio).
            INITRD=$(ls "$R"/boot/initrd* 2>/dev/null | head -1 || true)
            if [ -n "$INITRD" ]; then
              python3 {{ e2e_dir }}/scripts/mdadm-initrd-audit.py "$INITRD" /dev/md0 \
                || errs+=("[initramfs audit failed: no mdraid module, or no ARRAY /dev/md0 in its mdadm.conf]")
            else
              errs+=("[no initrd under the image boot/ -- cannot verify the initramfs]")
            fi
            [ -f "$R/etc/cos/bootargs.cfg" ] && { grep -q 'rd.auto' "$R/etc/cos/bootargs.cfg" \
              || errs+=("[rd.auto missing from bootargs.cfg — array will not assemble]"); }
            umount /tmp/kairos-mdraid-img
          fi
          losetup -d "$IMG_LOOP" 2>/dev/null || true
          umount /tmp/kairos-mdraid-state
          break
        done
        [ "$mounted" = 1 ] || errs+=("[could not mount any cOS image to inspect]")
        if [ -n "${errs[*]:-}" ]; then
          echo "kairos_build_mdraid verification FAILED: ${errs[*]}" >&2
          exit 1
        fi
        echo "mdraid verification OK — mdadm in rootfs + rd.auto on cmdline"

    - name: Trim sparse zeros
      ansible.builtin.shell: fallocate --dig-holes {{ raw_disk_path }}
      failed_when: false

    - name: Generate checksum
      ansible.builtin.shell: |
        cd {{ build_dir }}
        sha256sum {{ kairos_profile }}-disk.raw > {{ kairos_profile }}-disk.raw.sha256

    - name: Record the raw-disk build-input stamp
      ansible.builtin.copy:
        content: "{{ kairos_raw_stamp.stdout }}\n"
        dest: "{{ build_dir }}/.raw-stamp-{{ kairos_profile }}"
        mode: "0644"

- name: Restore ownership of build artifacts to invoking user
  ansible.builtin.file:
    path: "{{ build_dir }}"
    state: directory
    owner: "{{ invoking_user.stdout }}"
    group: "{{ invoking_user.stdout }}"
    recurse: true
  become: true
