---
# Defaults for roles/kairos_build. Inventory values in
# inventory/group_vars/all.yml override anything set here.

# Profile name — namespaces the local build artifact, the BCM-side software
# image, the BCM cmsh category, the upload directory under /cm/shared/kairos/,
# and the HTTP URL the compute node fetches from. Multiple builds with
# different kairos_profile values can coexist on the same BCM.
kairos_profile: "default-kairos"

# Effective contents of CanvOS/.arg. Defaults reproduce the keys the pipeline
# previously hardcoded; user overrides via inventory's `kairos_canvos_args`
# dict are merged on top, and arbitrary new keys (e.g. anything else CanvOS
# accepts) flow through to the rendered .arg verbatim.
kairos_canvos_defaults:
  CUSTOM_TAG: "bcm-test"
  IMAGE_REGISTRY: "ttl.sh"
  OS_DISTRIBUTION: "ubuntu"
  IMAGE_REPO: "ubuntu"
  OS_VERSION: "22.04"
  K8S_DISTRIBUTION: "k3s"
  ISO_NAME: "palette-edge-installer"
  ARCH: "amd64"
  HTTPS_PROXY: ""
  HTTP_PROXY: ""
  UPDATE_KERNEL: "false"
  CLUSTERCONFIG: "spc.tgz"
  CIS_HARDENING: "false"
  EDGE_CUSTOM_CONFIG: ".edge-custom-config.yaml"
  FORCE_INTERACTIVE_INSTALL: "false"
  UBUNTU_PRO_KEY: ""

# Open-ended user dict, merged over kairos_canvos_defaults. Any key the user
# adds appears in CanvOS/.arg as KEY=VALUE.
kairos_canvos_args: {}

# Extra apt packages installed in the Kairos image via a Dockerfile RUN block.
# Empty list = no extra packages installed (image is byte-identical to the
# pre-customization build).
kairos_extra_apt_packages: []

# Raw YAML written to CanvOS/.edge-custom-config.yaml before the ISO build.
# CanvOS bakes it into the image when the .arg sets EDGE_CUSTOM_CONFIG, and the
# appliance uses it to carry the CONTENT-SIGNING PUBLIC KEY. Without that key an
# appliance rejects a signed content bundle with
#   500 content verification failed: public key to verify content not found
# Empty (default) = no file, and the block is removed if a previous profile
# left one behind (all profiles share one CanvOS checkout).
kairos_edge_custom_config: ""

# How the raw disk gets installed.
#
# false (default, Kairos EDGE images): boot the ISO with the cloud-config on a
#   CIDATA disk and drive `kairos-agent install` over the serial console. The
#   edge live environment sits at a root shell and does nothing on its own, so
#   the automation owns the disk.
#
# true (APPLIANCE images): bake the cloud-config into the ISO instead and let
#   the ISO install ITSELF, then wait for it to power off. A stylus/appliance
#   image boots its own installer, and its config carries hooks that mount
#   COS_PERSISTENT the moment those labels appear — so an injected
#   `kairos-agent install` loses a race it cannot win: the labels it writes are
#   grabbed by the live environment and its own blkdeactivate then fails with
#   "device or resource busy" on every retry. Driving the image the way it is
#   designed to be driven avoids the fight entirely.
kairos_build_self_install: false

# Raw Dockerfile instructions appended to the CanvOS image build, for image
# customization that kairos_extra_apt_packages cannot express — a COPY of a
# CanvOS-provided script, a multi-step RUN, and so on. Empty = nothing added.
# Used by profiles/palette-appliance.yml to add the LVM/DRBD host tooling and
# kernel headers the Piraeus/LINSTOR storage stack needs.
kairos_dockerfile_extra: ""

# Base cloud-config for the image, rendered to build/cloud-config.yaml and
# delivered as /oem/90_custom.yaml during the OVMF install. The default is the
# Kairos EDGE config (BCM integration + Palette registration + the kairos user).
#
# A profile can point this at a different template to build a fundamentally
# different image through the same stage 3 -> 4 -> 5 pipeline — that is how the
# Palette management appliance is built (profiles/palette-appliance.yml uses
# appliance-cloud-config.yaml.j2). kairos_user_data only LAYERS on top of this
# file, so it cannot express "replace the base config".
kairos_cloud_config_template: "cloud-config.yaml.j2"

# Raw cloud-config YAML written to /oem/99_userdata.yaml inside the built
# image, layered on top of /oem/90_custom.yaml. Empty string = no extra
# userdata file is written. Must NOT redefine the kairos user or the install
# block — those are owned by the base 90_custom.yaml.
kairos_user_data: ""

# Switches the role between two Earthly targets and gates the OVMF QEMU
# install + raw-disk patching half:
#
# true  (day-1) → ./earthly.sh +iso: builds the ISO file locally; provider
#                 images are saved to the local Docker daemon only (NOT
#                 pushed to kairos_container_registry). The role then runs
#                 the OVMF QEMU install to produce build/<profile>-disk.raw
#                 for PXE/dd. No registry credentials needed.
#
# false (day-2) → ./earthly.sh --push +build-provider-images: pushes the
#                 provider-image matrix to kairos_container_registry (one
#                 image per entry in CanvOS/k8s_version.json); skips ISO
#                 assembly, OVMF QEMU install, and raw-disk patching.
#                 Palette pulls the new image tag and rolling-upgrades
#                 cluster nodes — no PXE/dd needed. Requires push creds for
#                 the registry (ttl.sh is anonymous; Harbor/JFrog need login).
#
# `make kairos-image` flips this to false automatically.
kairos_build_raw_disk: true

# Build a RAID-capable Kairos image (opt-in; default false = byte-identical to
# today). When true, the build makes the image's initramfs able to assemble a
# Linux software-RAID (mdadm) array at boot, so the raw image can later be
# dd'd onto a /dev/md* device (e.g. an OS RAID1 mirror) by stage-4 deploy-dd
# and still boot. It does NOT create any array here — the raw image is still a
# single-disk image; only the on-boot *assembly* capability is added:
#   1. mdadm is added to the Earthfile apt line (present before the initramfs
#      is generated — the Dockerfile layer would be too late for dracut),
#   2. a dracut drop-in pulls the `mdraid` module into the initramfs,
#   3. `rd.auto=1` is appended to the cOS kernel cmdline so dracut scans and
#      assembles arrays before the root pivot.
# Array creation (mdadm --create, metadata=1.0 for UEFI), the dd target
# /dev/md0, and the /raid data array are stage-4 concerns, gated separately.
kairos_build_mdraid: false

# Optional override for CanvOS/k8s_version.json. CanvOS reads that file when
# K8S_VERSION is empty in .arg, building one container image per
# (distribution, version) entry. Empty dict (default) leaves whatever ships
# with upstream CanvOS untouched. Format is { distribution: [bare version
# strings] } — CanvOS appends the flavor tag (-k3s1, -rke2r1, …) itself, so
# DO NOT include it in the values:
#   kairos_k8s_versions:
#     k3s:
#       - "1.31.6"
#       - "1.32.1"
#     rke2:
#       - "1.32.1"
kairos_k8s_versions: {}

# Size of the raw disk image kairos-agent installs into, and therefore the
# exact number of bytes stage 4 dd's onto the node's target device. The target
# must be at least this large -- on a RAID profile that is the ARRAY, not a
# member.
#
# There is a hard floor well above zero: the image's own layout asks for
# OEM + recovery + state (5120 + 20200 + 25576 MiB on the current edge image)
# before COS_PERSISTENT gets anything, and kairos-agent refuses outright with
# "the requested partitions size (50960MiB) does not fit in the target disk".
# So shrinking this to make a test rig cheaper only buys the difference
# between ~56 GiB and 80 GiB -- check the installer's own "Setting <x>
# partition size" lines in logs/qemu-install.log before changing it.
kairos_raw_disk_size: "81920M"

# Ship the BCM integration hook (overlay's stylus-agent bcm-sync.conf drop-in).
# True for edge images, which are registered BCM nodes and whose installed
# rootfs is the CanvOS-built one carrying the scripts the hook calls. Set false
# for an image whose rootfs does not carry them -- see the task that consumes
# this in tasks/main.yml.
kairos_build_bcm_integration: true
