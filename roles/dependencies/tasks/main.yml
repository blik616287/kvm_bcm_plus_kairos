---
# Install build dependencies for BCM + Kairos KVM deployment.

- name: Detect package manager
  ansible.builtin.set_fact:
    pkg_mgr: "{{ 'apt' if ansible_facts['os_family'] == 'Debian' else 'dnf' }}"

# Docker is handled separately: a pre-existing Docker CE install (containerd.io
# from Docker's official repo) conflicts with the distro docker.io / docker
# package, so only install the distro package when no docker is present.
- name: Check for an existing docker binary
  ansible.builtin.command: docker --version
  register: docker_check
  changed_when: false
  failed_when: false

- name: Install dependencies (Debian/Ubuntu)
  when: pkg_mgr == 'apt'
  ansible.builtin.apt:
    name:
      - qemu-system-x86
      - qemu-utils
      - ovmf
      - sshpass
      - xorriso
      - p7zip-full
      - lz4
      - jq
      - mtools
      - dosfstools
      - cpio
      - gzip
      - curl
      - nfs-common
      - gdisk
      - e2fsprogs
      - socat
    state: present
    update_cache: true
  become: true

- name: Install docker.io (Debian/Ubuntu, only if docker is not already present)
  when:
    - pkg_mgr == 'apt'
    - docker_check.rc != 0
  ansible.builtin.apt:
    name: docker.io
    state: present
    update_cache: true
  become: true

- name: Install dependencies (Fedora/RHEL)
  when: pkg_mgr == 'dnf'
  ansible.builtin.dnf:
    name:
      - qemu-system-x86-core
      - qemu-img
      - edk2-ovmf
      - sshpass
      - xorriso
      - p7zip
      - lz4
      - jq
      - mtools
      - dosfstools
      - cpio
      - gzip
      - curl
      - nfs-utils
      - gdisk
      - e2fsprogs
      - socat
    state: present
  become: true

- name: Install docker (Fedora/RHEL, only if docker is not already present)
  when:
    - pkg_mgr == 'dnf'
    - docker_check.rc != 0
  ansible.builtin.dnf:
    name: docker
    state: present
  become: true
