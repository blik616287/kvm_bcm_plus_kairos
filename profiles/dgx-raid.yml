---
# Deploy profile for the DGX A100 "dgx03" — OS RAID1 mirror + data RAID0.
# Reproduces the engineer's BCM disksetup (2-drive OS mirror + 8-drive /raid
# stripe) under the Kairos/dd model. Both halves are wired and validated:
#   - stage 3 (kairos_build_mdraid) builds a RAID-capable image (IN-2346)
#   - stage 4 (kairos_os_raid/kairos_data_raid) has the finalize script create
#     the arrays + auto-mount the data array (IN-2347)
#
# Pass to every stage:
#   make kairos-build ANSIBLE_ARGS="-e @profiles/dgx-raid.yml"
#   make deploy-dd    ANSIBLE_ARGS="-e @profiles/dgx-raid.yml"
#   make validate     ANSIBLE_ARGS="-e @profiles/dgx-raid.yml"

kairos_profile: "dgx-raid"

# --- Stage 3: RAID-capable image ---
# Adds mdadm + the dracut mdraid module + rd.auto=1 so the raw image can be
# dd'd onto /dev/md0 and still boot. Off = today's single-disk image.
kairos_build_mdraid: true

kairos_canvos_args:
  # Distinct ISO_NAME so the "ISO already exists" short-circuit doesn't reuse
  # another profile's (non-mdraid) ISO from build/.
  ISO_NAME: "palette-edge-dgxraid"

# --- Stage 4: array layout (from the engineer's dgx03 disksetup) ---
# OS = 2x 1.92 TB Samsung mirrored; data = 8x 3.84 TB KIOXIA striped at /raid.
# The DGX A100 is a fixed-layout appliance and these device names are the
# engineer's authoritative disksetup — `make validate` re-confirms the live
# /dev/nvme* names on the node at deploy time (BMC Device# != Linux name).
kairos_os_raid:
  level: 1
  metadata: "1.0"          # superblock at END so UEFI can read the ESP off a member
  devices: [nvme2n1, nvme3n1]
kairos_target_disk: /dev/md0    # dd target = the assembled OS mirror

kairos_data_raid:
  - name: raid
    level: 0
    devices: [nvme0n1, nvme1n1, nvme4n1, nvme5n1, nvme6n1, nvme7n1, nvme8n1, nvme9n1]
    filesystem: ext4
    mount: /raid

# Big disks → the finalize-stage install (grow/timeout/efibootmgr fix) matters.
deploy_dd_finalize_install: true

# --- Remote-BCM node targeting ---
# The existing cmsh device to re-image. deploy-dd clones the <kairos_profile>
# category, moves this node into it, and (finalize) points its firmware at the
# freshly-written Kairos. Node's boot order must be DISK-first / PXE-fallback.
bcm_target_node: "dgx03"
