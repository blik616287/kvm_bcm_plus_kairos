---
all:
  # ─────────────────────────────────────────────────────────────────────────
  # LOCAL-KVM DEFAULTS
  # These let `make all` stand up a BCM head node + Kairos compute node in QEMU
  # from a MINIMAL inventory/group_vars/all.yml (see all.local-kvm.example.yml).
  #
  # Precedence: vars here are *inventory group vars*, which sit BELOW
  # group_vars/all.yml. So anything in group_vars/all.yml — e.g. a remote/
  # customer BCM config — overrides every value here, and `-e` (ANSIBLE_ARGS)
  # overrides both. Remote-BCM deploys are therefore unaffected by this block.
  #
  # For a local-KVM run, group_vars/all.yml needs only the secret/site values
  # that have no safe default: `jfrog_token` (BCM ISO download) and
  # `kairos_target_disk` (which disk to dd — never auto-guessed, it can brick a
  # box). Palette is optional (placeholders below); set real values only if you
  # want the node to register.
  # ─────────────────────────────────────────────────────────────────────────
  vars:
    # BCM connection (local QEMU). Remote sets bcm_ssh_host to a real IP + a
    # jumphost in group_vars/all.yml.
    bcm_ssh_host:         "localhost"
    bcm_password:         "bcm-test-pw"      # root pw baked into the local BCM VM
    bcm_ssh_port:         10022              # QEMU hostfwd → BCM:22
    bcm_https_port:       10443              # QEMU hostfwd → BCM:443

    # BCM provisioning network (the internal QEMU socket network)
    # The socket port is the LINK itself: BCM holds `listen=`, a compute VM
    # `connect=`s. QEMU accepts exactly one peer per process lifetime, so this
    # is point-to-point — see roles/kairos_vm/tasks/main.yml.
    # How BCM and the compute VMs share the provisioning LAN:
    #   bridge  a host bridge with one tap per VM. A real multi-peer LAN, so
    #           several nodes can be up at once -- required for anything where
    #           an edge node has to reach an appliance on the same network.
    #   socket  the original point-to-point QEMU socket netdev. Carries exactly
    #           ONE compute VM; a second gets no carrier and fails PXE.
    bcm_internal_net_mode: "bridge"
    bcm_internal_bridge: "br-kairos"
    # Only used when bcm_internal_net_mode is socket.
    bcm_internal_socket_port: 31337
    bcm_internal_ip:      "192.168.98.2"
    bcm_internal_cidr:    "192.168.98.0/24"
    bcm_internal_netmask: "24"

    # BCM head-node VM identity + sizing (stages 1-2, local-KVM only)
    bcm_hostname:         "bcm11-headnode"
    bcm_timezone:         "America/Los_Angeles"
    bcm_external_gateway: "10.0.2.2"         # QEMU user-mode NAT gateway
    bcm_external_dns:     "1.1.1.1"
    bcm_vm_ram:           8192               # MB
    bcm_vm_cpus:          4
    bcm_vm_disk_size:     "100G"

    # BCM ISO download (stage 1). jfrog_token is the one secret you MUST set in
    # group_vars/all.yml; the rest default here.
    jfrog_instance:       "insightsoftmax.jfrog.io"
    jfrog_repo:           "iso-releases"
    iso_filename:         "bcm-11.0-ubuntu2404.iso"

    # Kairos compute-node VM (stage 5, local-KVM only)
    kairos_vm_mac:        "52:54:00:00:02:01"
    kairos_vm_ram:        4096              # MB
    kairos_vm_cpus:       2
    kairos_vm_disk_size:  "80G"

    # Palette — the Palette that edge nodes REGISTER TO. Placeholders so a
    # bring-up builds + boots without a reachable Palette. Set real values in
    # group_vars/all.yml to actually register the node — or stand up the
    # self-hosted appliance below (`make palette-appliance`) and copy its
    # endpoint/API key in. See "Self-hosted Palette" in README.md.
    palette_endpoint:     "api.spectrocloud.com"
    palette_project_uid:  ""
    palette_api_key:      ""


    # ─────────────────────────────────────────────────────────────────────
    # SELF-HOSTED PALETTE APPLIANCE (optional; local-KVM only)
    # The appliance is built and deployed BY BCM through the ordinary stage
    # 3 -> 4 -> 5 pipeline, driven by profiles/palette-appliance.yml. Anything
    # describing the IMAGE or the NODE (CanvOS args, node name/MAC/IP, VM
    # sizing, target disk) therefore lives in that profile, not here — only
    # values several roles share, and which are not image/node shaped, sit here.
    #
    # Note the appliance_ prefix: roles/kairos_build sets `canvos_dir`,
    # `iso_name` and `arch` as FACTS that persist across a run's imported plays.
    # ─────────────────────────────────────────────────────────────────────

    # ─── The licensed Palette artifact set: version, names, locations ───
    # All of it lives HERE rather than in profiles/palette-appliance.yml, so an
    # operator retargets it from inventory/group_vars/all.yml. A profile could
    # not be overridden that way: a profile is passed with -e, and extra-vars
    # beat group_vars, so a name pinned in a profile is final. A per-version
    # profile may still pin its own set deliberately — that is what lets two
    # bundle versions coexist on one rig.

    # TWO VERSION NUMBERS, and they are not the same one:
    #   appliance_bundle_version — the PACKAGE version, i.e. the filename
    #   appliance_pe_version     — the STYLUS AGENT version INSIDE the bundle
    # A palette-enterprise-appliance-4.10.17.tar.zst bundle ships stylus
    # v4.10.4. Read the second out of the bundle, never off the name:
    #   python3 playbooks/files/bundle_stylus_version.py artifacts/<bundle>.tar.zst
    # appliance_credentials.yml checks it against the bundle, and both profiles
    # derive the CanvOS PE_VERSION from it, so this is the only place to change.
    appliance_bundle_version: "4.10.17"
    appliance_pe_version:     "v4.10.4"

    # WHERE the artifacts live locally, and the absolute-path overrides.
    # A path here wins over the name-derived one below, for a bundle kept
    # outside appliance_artifacts_dir; empty = derive it. See artifacts/README.md.
    appliance_artifacts_dir: "{{ lookup('env', 'E2E_DIR') | default(playbook_dir + '/..', true) }}/artifacts"
    appliance_content_bundle: ""
    appliance_content_bundle_signature: ""
    appliance_signing_public_key: ""

    # JFrog mirror for those downloads, so a fresh rig fetches them the same
    # way stage 1 fetches the BCM ISO instead of anyone hand-copying ~10 GB.
    # Same instance and credential as the BCM ISO by default; a different repo,
    # because a content bundle is not an ISO release.
    appliance_jfrog_instance: "{{ jfrog_instance }}"
    appliance_jfrog_repo:     "palette-content"
    appliance_jfrog_token:    "{{ jfrog_token | default('') }}"
    # Multi-GB over a slow link — the BCM ISO fetch is sized the same way.
    appliance_jfrog_fetch_timeout: 7200

    # WHICH FILES to move, by name. These are the JFrog paths AND the local
    # filenames — keeping them identical is what lets discovery above find them
    # after a pull with no further configuration. Derived from
    # appliance_bundle_version so one value retargets the set; override any of
    # them outright for a differently-named mirror. Leaving one empty drops it
    # from the transfer, so a site that mirrors only the bundle still works.
    appliance_bundle_filename: "palette-enterprise-appliance-{{ appliance_bundle_version }}.tar.zst"
    appliance_bundle_signature_filename: "palette-enterprise-appliance-{{ appliance_bundle_version }}.tar.sig.bin"
    appliance_signing_key_filename: "spectro_public_key.pem"
    appliance_jfrog_files:
      - "{{ appliance_bundle_filename }}"
      - "{{ appliance_bundle_signature_filename }}"
      - "{{ appliance_signing_key_filename }}"

    # Appliance Local UI login, seeded into the image. Empty password = one is
    # generated per run and persisted to .run-credentials.yml (0600,
    # gitignored). It is re-read on later invocations and MUST stay stable: the
    # image carries a HASH of it, so a regenerated password strands the box.
    appliance_admin_user:     "paletteadmin"
    appliance_admin_password: ""
    appliance_admin_group:    "admin"
    # fips=1 on a non-FIPS kernel can fail to boot; only set for a FIPS build.
    appliance_fips_enabled:   false

    # Management-cluster VIP, on the provisioning network so Kairos edge nodes
    # reach it directly. Outside BCM's DHCP pool (.16-.250). The profile pins
    # the appliance node itself with kairos_target_ip.
    appliance_vip:            "192.168.98.251"

    # How long to wait for the appliance's Local UI after BCM finishes
    # provisioning it (seconds).
    appliance_localui_timeout: 1800

  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
