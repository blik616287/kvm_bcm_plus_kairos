---
all:
  # ─────────────────────────────────────────────────────────────────────────
  # LOCAL-KVM DEFAULTS
  # These let `make all` stand up a BCM head node + Kairos compute node in QEMU
  # from a MINIMAL inventory/group_vars/all.yml (see all.local-kvm.example.yml).
  #
  # Precedence: vars here are *inventory group vars*, which sit BELOW
  # group_vars/all.yml. So anything in group_vars/all.yml — e.g. a remote/
  # customer BCM config — overrides every value here, and `-e` (ANSIBLE_ARGS)
  # overrides both. Remote-BCM deploys are therefore unaffected by this block.
  #
  # For a local-KVM run, group_vars/all.yml needs only the secret/site values
  # that have no safe default: `jfrog_token` (BCM ISO download) and
  # `kairos_target_disk` (which disk to dd — never auto-guessed, it can brick a
  # box). Palette is optional (placeholders below); set real values only if you
  # want the node to register.
  # ─────────────────────────────────────────────────────────────────────────
  vars:
    # BCM connection (local QEMU). Remote sets bcm_ssh_host to a real IP + a
    # jumphost in group_vars/all.yml.
    bcm_ssh_host:         "localhost"
    bcm_password:         "bcm-test-pw"      # root pw baked into the local BCM VM
    bcm_ssh_port:         10022              # QEMU hostfwd → BCM:22
    bcm_https_port:       10443              # QEMU hostfwd → BCM:443

    # BCM provisioning network (the internal QEMU socket network)
    bcm_internal_ip:      "192.168.98.2"
    bcm_internal_cidr:    "192.168.98.0/24"
    bcm_internal_netmask: "24"

    # BCM head-node VM identity + sizing (stages 1-2, local-KVM only)
    bcm_hostname:         "bcm11-headnode"
    bcm_timezone:         "America/Los_Angeles"
    bcm_external_gateway: "10.0.2.2"         # QEMU user-mode NAT gateway
    bcm_external_dns:     "1.1.1.1"
    bcm_vm_ram:           8192               # MB
    bcm_vm_cpus:          4
    bcm_vm_disk_size:     "100G"

    # BCM ISO download (stage 1). jfrog_token is the one secret you MUST set in
    # group_vars/all.yml; the rest default here.
    jfrog_instance:       "insightsoftmax.jfrog.io"
    jfrog_repo:           "iso-releases"
    iso_filename:         "bcm-11.0-ubuntu2404.iso"

    # Kairos compute-node VM (stage 5, local-KVM only)
    kairos_vm_mac:        "52:54:00:00:02:01"
    kairos_vm_ram:        4096              # MB
    kairos_vm_cpus:       2
    kairos_vm_disk_size:  "80G"

    # Palette — placeholders so a bring-up builds + boots WITHOUT a reachable
    # Palette (a local on-prem Palette usually isn't reachable from the KVM
    # rig). Set real values in group_vars/all.yml to actually register the node.
    palette_endpoint:     "api.spectrocloud.com"
    palette_project_uid:  ""
    palette_api_key:      ""

  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
