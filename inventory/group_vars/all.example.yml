# ---------------------------------------------------------------------------
# Example inventory for a remote-BCM deployment (skips stages 1 & 2 — bcm-prepare
# and bcm-vm). Use when you're targeting an already-running BCM head node and
# want to kairos-build + deploy-dd against it.
#
# Copy to inventory/group_vars/all.yml (which is gitignored) and fill in values.
# ---------------------------------------------------------------------------

# ==== BCM connection ====
# How deploy-dd and validate reach the BCM head node. Every SSH/SCP call in
# roles/deploy_dd and roles/validate goes through these — there is no direct
# Ansible connection to BCM, only shell tasks on localhost that invoke
# `sshpass -p $bcm_password ssh -F <per-run ssh config>`.

# Root SSH password on BCM. Consumed by:
#   - roles/deploy_dd/templates/deploy-dd.sh.j2  (every SSH/SCP to BCM during stage 4)
#   - roles/validate/templates/validate.sh.j2    (remote cmsh queries during stage 6)
# Stored in inventory because BCM root login is password-based by default.
bcm_password:        ""

# BCM's SSH endpoint as seen from THIS host (the build host running ansible).
# When there's no jumphost this is BCM's reachable IP/hostname; when there IS
# a jumphost this is the address you'd use on the *far side* of the jumphost
# (typically BCM's internal IP), because ProxyCommand tunnels us onto that net.
# Consumed as BCM_HOST in deploy-dd.sh.j2 and validate.sh.j2.
bcm_ssh_host:        "192.168.98.2"
bcm_ssh_port:        22                              # TCP port for the SSH above

# Optional jumphost. Applied via an OpenSSH ProxyCommand line that gets baked
# into the per-run `.bcm-ssh-config` / `.discover-ssh-config` written by
# deploy_dd, validate, and discover-bcm.yml. Leave blank for a directly
# reachable BCM. Format: "user@host". Uses bcm_ssh_proxy_key for auth to the
# jumphost (the jumphost only forwards — auth to BCM still uses bcm_password).
bcm_ssh_proxy_jump:  "partner@100.90.255.42"
bcm_ssh_proxy_key:   "~/.ssh/bcm-jump"                    # jumphost private key; `~` expanded at template-render time

# ==== BCM provisioning network ====
# These describe the flat L2 network where BCM runs DHCP/PXE/TFTP/NFS/HTTP and
# where the compute nodes live. Not the customer's external/corporate net.

# BCM's IP on the provisioning network (the address compute nodes see).
# Consumed by:
#   - roles/deploy_dd/templates/install-kairos.sh.j2  (baked in as HEAD_IP —
#     the HTTP source that compute nodes curl the lz4 image from at :8888)
#   - roles/deploy_dd/templates/deploy-dd.sh.j2       (used to derive the
#     synthetic compute-node IP = <prefix>.10 for validation reporting)
#   - roles/validate/templates/validate.sh.j2         (target of health pings)
#   - roles/kairos_build/templates/cloud-config.yaml.j2 (NFS mount source +
#     cert-fetch host in the Kairos first-boot cloud-config)
bcm_internal_ip:      "192.168.98.2"
# Full CIDR of the provisioning network. Consumed by deploy-dd.sh.j2 to scope
# NFS exports for /cm/shared to this network, and to derive the NET_PREFIX
# used when the script allocates IPs for newly-added compute nodes.
bcm_internal_cidr:    "192.168.98.0/24"

# Safety flag: DO NOT rewrite BCM's cluster-wide DNS resolver.
# Consumed by deploy-dd.sh.j2 and validate.sh.j2 — when false, the DNS
# reconfiguration block is skipped and the site's existing resolver is left
# alone. Keep this false on any customer BCM. Set true ONLY on a fresh/local
# BCM where you own the DNS config (i.e. the local-KVM mode).
bcm_manage_dns: false

# Safety flag: DO NOT flip cluster-wide defaults (`defaultcategory`,
# `nodebasename` in cmsh). Consumed by deploy-dd.sh.j2 at the "cluster
# defaults" block. Keep false on customer BCMs so that new nodes that PXE
# into this BCM continue to inherit the site's existing defaults, not
# `kairos`. Set true only when the whole BCM is yours.
bcm_manage_cluster_defaults: false

# ==== Target compute node on that BCM ====
# Identifies the specific device we're re-imaging with Kairos this run, and
# the disk layout on that device.

# Existing cmsh device name. Consumed by deploy-dd.sh.j2's "move target node
# into kairos category" block: it runs `cmsh device use <name>; set category
# kairos; set softwareimage kairos-installer; set installmode FULL` on this
# device and only this device. Must match an already-defined device in BCM
# (use `make discover` to list them). Also echoed by validate.sh.j2.
bcm_target_node:     "edge-4c4c454400485610804bc3c04f4e4434"

# Existing BCM category to clone when deploy-dd creates the `kairos` category
# on first run. Consumed by deploy-dd.sh.j2's category-clone step
# (`cmsh category clone "<source>" kairos`). The clone inherits disksetup,
# mon templates, interfaces — we then override softwareimage + FinalizeXML.
# Cloning (rather than creating empty) preserves site-specific disk layout
# for the target hardware. Must exist on BCM.
bcm_source_category: "Partner Lab"

# OPTIONAL: MAC address of the compute node's provisioning NIC. When set,
# deploy-dd.sh.j2's "target existing device" block adds `set mac <value>` to
# the cmsh commit on bcm_target_node. This makes the deploy self-contained —
# the MAC mapping doesn't have to be pre-configured on the device via cmsh.
# Useful when bcm_target_node already exists but was registered without a MAC
# (or with a stale one from previous hardware). Leave unset/empty to keep
# whatever MAC cmsh already has on the device. Format: lowercase, colon-
# separated, e.g. "4c:4c:45:44:00:48".
# kairos_target_mac:   ""

# OPTIONAL: IP address to assign to the compute node on the provisioning
# network. When set, deploy-dd.sh.j2 adds `set ip <value>` to the same cmsh
# commit. Parallel to kairos_target_mac — lets this deploy own the IP mapping
# instead of relying on whatever cmsh already has. Must be inside
# bcm_internal_cidr and outside the DHCP pool range (the pool is
# .16–.250 within the CIDR). Leave unset/empty to keep the existing IP.
# kairos_target_ip:    ""

# OS disk on the compute node that `dd` will overwrite with the Kairos raw
# image. Consumed by install-kairos.sh.j2 as $DISK. Pinned — not
# auto-detected, because picking the wrong disk bricks the node. Use
# `/dev/nvme0n1` on NVMe hardware, `/dev/sda` on SAS/SATA.
kairos_target_disk:  "/dev/nvme0n1"

# Space-separated list of sibling disks on the compute node to `wipefs -a -f`
# before dd-ing kairos_target_disk. Consumed by install-kairos.sh.j2 as
# $WIPE_DISKS. Needed because previous BCM/HPC installs often leave LVM PVs
# and DRBD metadata on non-OS disks; if we don't wipe them, Kairos's
# persistent-partition logic can see stale signatures and refuse to mount.
# Names are bare device names (no /dev/ prefix).
kairos_wipe_disks:   "nvme1n1 nvme2n1 nvme3n1 nvme4n1"

# ==== Palette ====
# These are baked into the Kairos image at build time (stage 3, kairos_build)
# via roles/kairos_build/templates/cloud-config.yaml.j2, NOT applied at
# deploy-dd time. Changing any of these requires a rebuild
# (`make clean-canvos && make kairos-build`).

# Palette API hostname (SaaS `api.spectrocloud.com` or on-prem e.g.
# `palette.example.com`). Written into stylus config as `paletteEndpoint` and also
# referenced by the on-node palette-cleanup-stale.sh pre-registration hook
# when calling the admin API to delete stale records / mint tokens.
palette_endpoint:          "palette.example.com"

# Palette project identity the node registers into. `project_name` is the
# human-readable label used in stylus config; `project_uid` is the internal
# ID consumed by the on-node admin-API cleanup + auto-token-minting script.
# Both are baked into cloud-config.yaml.j2.
palette_project_name:      "Default"
palette_project_uid:       "69a81eb07122277de95c3b1f"

# Palette ADMIN API key. Required permissions: `edgeToken.create` +
# `edgehost.delete`. Consumed by palette-cleanup-stale.sh (baked into the
# image via the CanvOS overlay) to:
#   1. Delete any stale edge-host record whose UID collides with this node's
#      SMBIOS-derived UID, making re-deploys safe.
#   2. Auto-mint a fresh edgeHostToken on first boot if `palette_token`
#      wasn't baked in (see below).
# Required unless you bake in a pre-minted `palette_token` AND don't need
# stale-host cleanup for re-deploys.
palette_api_key:           ""

# Stylus config toggles. Baked into cloud-config.yaml.j2.
#   installation_mode: `connected` (node reaches Palette directly) or
#                      `airgap`    (local Palette / mirrored content).
#   management_mode:   `central`   (managed from Palette tenant) or
#                      `local`     (self-managed).
palette_installation_mode: "connected"
palette_management_mode:   "central"

# PEM block for a private CA that signed the Palette endpoint's TLS cert.
# Baked into cloud-config.yaml.j2 and installed into the image's trust
# store at build time. Only required for on-prem Palette with a non-public
# cert; leave empty/omitted for SaaS Palette with public certs.
palette_ca_cert: |
  -----BEGIN CERTIFICATE-----
  ...
  -----END CERTIFICATE-----

# OPTIONAL: pre-minted, project-scoped edge-host registration token. When
# present, baked into cloud-config.yaml.j2 as `edgeHostToken` and used
# verbatim at first boot. When absent, palette-cleanup-stale.sh mints one
# on first boot via `POST /v1/edgehosts/tokens` using palette_api_key +
# palette_project_uid. Using the auto-mint path is usually simpler — it
# avoids token expiry mismatches when an image is built long before deploy.
# palette_token: ""

# ---------------------------------------------------------------------------
# The rest of these are NOT consumed on a remote-BCM deploy — they're only
# used by stages 1 (bcm-prepare), 2 (bcm-vm), or 5 (kairos-vm) of the local-KVM
# pipeline. Kept here for completeness / documentation only.
# ---------------------------------------------------------------------------

# ==== Local-KVM BCM VM sizing (stages 1 & 2) ====
# bcm_hostname:         "bcm11-headnode"     # BCM hostname; baked into build-config.xml
# bcm_timezone:         "America/Los_Angeles"
# bcm_external_gateway: "10.0.2.2"           # rendered into build-config.xml by bcm_prepare
#
# bcm_external_dns is consumed by bcm_prepare (baked into build-config.xml) AND
# by deploy-dd.sh.j2's DNS-forwarders block when bcm_manage_dns=true. On a
# remote-BCM deploy with bcm_manage_dns=false it's unused.
# bcm_external_dns:     "1.1.1.1"
#
# bcm_internal_netmask is consumed only by bcm_prepare's bcm-autoinstall.sh to
# configure eth0 + DHCP mask on the installed BCM. Unused on remote-BCM.
# bcm_internal_netmask: "24"
#
# bcm_vm_ram:           8192                 # MB
# bcm_vm_cpus:          4
# bcm_vm_disk_size:     "100G"
# bcm_https_port:       10443                # QEMU host-port forward to BCM:443 (web UI)

# ==== JFrog (BCM ISO download, only for bcm-prepare) ====
# jfrog_token:    ""
# jfrog_instance: "insightsoftmax.jfrog.io"
# jfrog_repo:     "iso-releases"
# iso_filename:   "bcm-11.0-ubuntu2404.iso"

# ==== Local-KVM Kairos compute VM (only for kairos-vm stage) ====
# kairos_vm_mac:       "52:54:00:00:02:01"
# kairos_vm_ram:       4096
# kairos_vm_cpus:      2
# kairos_vm_disk_size: "80G"

# ==== Kairos build (usually leave defaults) ====
# Temporary container registry used by CanvOS during kairos-build. ttl.sh is
# anonymous and expires images after a few hours — fine for one-shot builds.
# kairos_container_registry: "ttl.sh"
