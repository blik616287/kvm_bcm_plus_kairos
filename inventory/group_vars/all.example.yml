# ---------------------------------------------------------------------------
# Example inventory. Copy to inventory/group_vars/all.yml (gitignored) and
# fill in real values. Use `make discover` against an existing BCM to harvest
# most of these (BCM internal IP, CIDR, internal NIC, external DNS, etc.) into
# bcm-discovery-<bcm-hostname>.yml, then paste the suggested values here.
#
# Two deploy modes share this file:
#  - Remote BCM   — typical customer site. Requires bcm_ssh_host + jumphost.
#                   Stages 3, 4, 6 only. Safety flags must stay false.
#  - Local KVM    — dev/demo. bcm_ssh_host=localhost, no jumphost. All 6
#                   stages run; bcm-prepare downloads + remasters BCM ISO.
# ---------------------------------------------------------------------------

# ==== BCM connection ====
# How deploy-dd and validate reach the BCM head node. Every SSH/SCP from the
# build host goes through these via a per-run config file (`build/.bcm-ssh-
# config`) — there is no Ansible delegate_to; tasks run on localhost and shell
# out with `sshpass -p $bcm_password ssh -F <config> bcm-target`.

# Root SSH password on BCM. Used by:
#   - roles/deploy_dd/templates/deploy-dd.sh.j2  (every BCM call during stage 4)
#   - roles/validate/templates/validate.sh.j2    (BCM-side checks during stage 6)
bcm_password:        "ROOT-SSH-PASSWORD"

# BCM's SSH endpoint as seen from the build host. With a jumphost, this is the
# address valid on the *far side* of the jumphost (typically BCM's internal
# IP). Without a jumphost, it's BCM's reachable IP/hostname.
bcm_ssh_host:        "192.168.98.2"
bcm_ssh_port:        22

# Optional jumphost in `user@host` form. Renders as an OpenSSH ProxyCommand
# baked into the per-run SSH config used by deploy_dd, validate, discover.
# Leave blank for a directly reachable BCM. Auth to the jumphost uses
# bcm_ssh_proxy_key; auth to BCM stays password-based via sshpass.
bcm_ssh_proxy_jump:  "partner@100.90.255.42"
bcm_ssh_proxy_key:   "~/.ssh/bcm-jump"          # `~` expanded at template-render time

# ==== BCM provisioning network ====
# BCM's IP on the provisioning network — the address compute nodes reach for
# DHCP/PXE/TFTP/NFS/HTTP. Consumed by:
#   - roles/deploy_dd/templates/install-kairos.sh.j2  (HEAD_IP, baked in for the
#     compute node's `curl http://<HEAD_IP>:8888/<profile>/disk.raw.lz4`)
#   - roles/deploy_dd/templates/deploy-dd.sh.j2       (NFS export CIDR)
#   - roles/validate/templates/validate.sh.j2         (BCM-internal-IP check)
#   - roles/kairos_build/templates/cloud-config.yaml.j2  (BCM-integration boot
#     stage's NFS mount source + cmd-in-chroot Master)
bcm_internal_ip:     "192.168.98.2"
bcm_internal_cidr:   "192.168.98.0/24"

# ==== Customer-BCM safety flags ====
# Two flags that gate the only operations that would be cluster-wide on the
# BCM. KEEP BOTH FALSE on customer/remote BCMs — flipping them rewrites
# state shared with every other category on the site.
#
# bcm_manage_dns        : when true, deploy-dd issues
#   `cmsh -c 'partition; use base; set nameservers $bcm_external_dns'` and
#   restarts named. Rewrites the cluster's DNS forwarders.
# bcm_manage_cluster_defaults : when true, deploy-dd flips the `base`
#   partition's `defaultcategory` to the new kairos_profile category and
#   sets `nodebasename`. Affects every newly-PXE'd node on the site.
bcm_manage_dns:               false
bcm_manage_cluster_defaults:  false

# ==== Target compute node ====
# Existing cmsh device name to re-image. deploy-dd does
#   cmsh device use <bcm_target_node>; set category <kairos_profile>; …
# on this device only. Use `make discover` to enumerate names + MACs.
bcm_target_node:     "edge-4c4c454400485610804bc3c04f4e4434"

# Existing BCM category to clone when creating the kairos_profile category
# on first run. The clone inherits disksetup, mon templates, FinalizeXML —
# preserves the site's per-hardware behavior. Must already exist on BCM.
bcm_source_category: "Partner Lab"

# OPTIONAL: write the booting NIC's MAC onto the target device's cmsh record.
# Mirrors the local-KVM `device add physicalnode … set mac …` pattern, so
# deploy-dd can own the MAC mapping rather than rely on prior cmsh
# registration. Useful when bcm_target_node exists but its MAC is empty or
# stale. Leave unset to keep cmsh's existing MAC.
# kairos_target_mac:  "e8:9e:49:ca:94:f8"

# OPTIONAL: write the BOOTIF interface IP onto the device's cmsh record.
# Must be inside the device's network's CIDR (cmsh silently rejects mismatches
# without an error). Note: this only updates cmsh; the physical cabling /
# DHCP relay still determines which network the box actually PXE-boots on.
# kairos_target_ip:   "192.168.98.10"

# OS disk on the compute node — overwritten by `dd`. Pinned, not auto-detected
# (picking the wrong disk bricks the box). `/dev/nvme0n1` for NVMe, `/dev/sda`
# for SAS/SATA. install-kairos.sh.j2 reads this as $DISK and does:
#   curl <RAW_URL> | lz4 -d | dd of=$DISK bs=4M oflag=direct
#   sgdisk -e $DISK; partprobe $DISK
#   <grow-last-partition logic>      (auto-grows COS_PERSISTENT to fill disk)
#   efibootmgr --create …            (UEFI boot entry for next power-on)
kairos_target_disk:  "/dev/nvme0n1"

# Sibling disks to wipefs before dd. Bare device names, space-separated.
# Clears LVM PV / DRBD / old filesystem signatures so Kairos's persistent-
# partition logic doesn't see stale metadata on next boot. Empty = no wipes.
kairos_wipe_disks:   "nvme1n1 nvme2n1 nvme3n1 nvme4n1"

# ==== Kairos profile (artifact + BCM-state namespacing) ====
# A profile bundles a build artifact + its BCM-side resources under one name.
# Multiple profiles can coexist on the same BCM — each gets its own software
# image, category, image directory, and `exclude-<profile>` health filter.
#
# Default `default-kairos`. Pick a different name per build to keep multiple
# Kairos variants side-by-side (e.g. one with extra apt packages, one
# CIS-hardened, one with a different OS_VERSION). What this controls:
#
#   - local artifact:        build/<profile>-disk.raw[.lz4]
#   - BCM upload:            /cm/shared/kairos/<profile>/disk.raw.lz4
#   - HTTP URL:              http://<bcm>:8888/<profile>/disk.raw.lz4
#   - cmsh software image:   <profile>-installer
#   - cmsh category:          <profile>
#   - exclude filter:         exclude-<profile>  (scoped to <profile> category)
kairos_profile:      "default-kairos"

# ==== Kairos build customization ====
# Open-ended dict merged over roles/kairos_build/defaults/main.yml's
# kairos_canvos_defaults. Override any subset of CanvOS .arg keys; arbitrary
# new keys flow through to .arg verbatim so future CanvOS additions don't
# require a role change. Defaults reproduce CanvOS upstream defaults plus the
# four user-facing knobs (OS_VERSION, UPDATE_KERNEL, CIS_HARDENING,
# UBUNTU_PRO_KEY). Common overrides:
kairos_canvos_args: {}
# Example:
# kairos_canvos_args:
#   OS_VERSION:      "22.04"      # also "20.04", "24.04"
#   UPDATE_KERNEL:   "true"       # let apt upgrade the kernel during build
#   CIS_HARDENING:   "false"      # run /cis-harden/harden.sh during build
#   UBUNTU_PRO_KEY:  ""            # if set, attaches Ubuntu Pro during build
#   CUSTOM_TAG:      "site-name"  # image tag in the temporary registry

# Open-ended apt package list. Each name appended to a Dockerfile RUN block
# in CanvOS, between the BCM-scripts COPY block and CanvOS's other layers.
# Empty list = unchanged image.
kairos_extra_apt_packages: []
# Example:
# kairos_extra_apt_packages: [htop, tcpdump, jq, lvm2]

# Open-ended raw cloud-config YAML written to /oem/99_userdata.yaml on the
# built image. Layered on top of /oem/90_custom.yaml (BCM/Palette base). Don't
# redefine `users:` or `install:` here — those are owned by the base. Empty
# string = no /oem/99_userdata.yaml is written.
kairos_user_data: ""
# Example:
# kairos_user_data: |
#   #cloud-config
#   stages:
#     boot:
#       - name: marker
#         commands:
#           - "echo CUSTOM_USER_DATA > /var/log/marker"

# ==== Palette ====
# Baked into the Kairos image at build time (stage 3) via
# roles/kairos_build/templates/cloud-config.yaml.j2. Changing any of these
# requires `make clean-canvos && make kairos-build`.

# Palette API hostname. SaaS = api.spectrocloud.com, on-prem = e.g. palette.example.com.
# Written into stylus config as paletteEndpoint and consumed by the on-node
# palette-cleanup-stale.sh + the dynamic Palette-label PUT in cloud-config.
palette_endpoint:           "palette.example.com"

# Palette project identity. project_name is the human label; project_uid is
# the internal ID consumed by palette-cleanup-stale.sh + the dynamic-label
# PUT (which uses the admin API project-scoped endpoints).
palette_project_name:       "Default"
palette_project_uid:        "69a81eb07122277de95c3b1f"

# Palette ADMIN API key. Required permissions:
#   edgeToken.create   (mint registration token if palette_token is unset)
#   edgehost.delete    (stale-record cleanup before re-registration)
#   edgehost.update    (PUT /v1/edgehosts/<uid>/meta to set tags+labels)
# Required unless palette_token is baked in AND you don't need stale-host
# cleanup AND you don't want dynamic Palette labels.
palette_api_key:            ""

# connected: node reaches Palette directly. airgap: local Palette / mirrored
# content. central: managed from Palette tenant. local: self-managed.
palette_installation_mode:  "connected"
palette_management_mode:    "central"

# PEM block for a private CA signing the Palette endpoint's cert. Required for
# on-prem Palette with non-public certs; leave empty for SaaS Palette.
palette_ca_cert: |
  -----BEGIN CERTIFICATE-----
  ...
  -----END CERTIFICATE-----

# OPTIONAL: pre-minted, project-scoped edge-host registration token. When
# present, baked into cloud-config.yaml.j2 as edgeHostToken. When absent,
# palette-cleanup-stale.sh mints one on first boot via
# `POST /v1/edgehosts/tokens` using palette_api_key + palette_project_uid.
# Auto-mint avoids token-expiry mismatch when an image is built long before
# deploy.
# palette_token:            ""

# ---------------------------------------------------------------------------
# The rest of these are NOT consumed on a remote-BCM deploy — they're only
# used by stages 1 (bcm-prepare), 2 (bcm-vm), or 5 (kairos-vm) of the local-KVM
# pipeline. Kept here for completeness / documentation only.
# ---------------------------------------------------------------------------

# ==== Local-KVM BCM VM sizing (stages 1 & 2) ====
# bcm_hostname:         "bcm11-headnode"     # baked into build-config.xml
# bcm_timezone:         "America/Los_Angeles"
# bcm_external_gateway: "10.0.2.2"           # only consumed by bcm_prepare;
#                                              irrelevant on remote BCM
# bcm_external_dns:     "1.1.1.1"            # consumed by bcm_prepare AND by
#                                              deploy-dd when bcm_manage_dns=true
# bcm_internal_netmask: "24"                 # consumed by bcm_prepare's
#                                              bcm-autoinstall.sh; unused remote
# bcm_vm_ram:           8192                 # MB
# bcm_vm_cpus:          4
# bcm_vm_disk_size:     "100G"
# bcm_https_port:       10443                # QEMU host-port forward to BCM:443

# ==== JFrog (BCM ISO download — only for bcm-prepare) ====
# jfrog_token:    ""
# jfrog_instance: "insightsoftmax.jfrog.io"
# jfrog_repo:     "iso-releases"
# iso_filename:   "bcm-11.0-ubuntu2404.iso"

# ==== Local-KVM Kairos compute VM (only for kairos-vm stage) ====
# kairos_vm_mac:       "52:54:00:00:02:01"
# kairos_vm_ram:       4096
# kairos_vm_cpus:      2
# kairos_vm_disk_size: "80G"

# ==== CanvOS container-build registry (used during kairos-build) ====
# Temporary ephemeral registry that holds the CanvOS-built container while
# Earthly assembles the ISO. ttl.sh is anonymous and expires after a few
# hours — fine for one-shot builds. Override only if your network blocks
# ttl.sh or you have your own registry.
# kairos_container_registry: "ttl.sh"

# ==== Day-2 ops: image-only build ====
# When false, the kairos_build role skips the OVMF QEMU install + raw disk
# patching steps. Only the CanvOS Earthly build runs, producing a container
# image pushed to kairos_container_registry. Use this for day-2 ops: bumping
# K8S_VERSION, kernel, or apt-package set, where Palette pulls the new image
# tag and rolling-upgrades the cluster nodes — no PXE re-install needed.
# `make kairos-image` flips this to false automatically; no need to set this
# in inventory for the normal day-1 flow.
# kairos_build_raw_disk: true

# ==== Multi-version k8s build ====
# CanvOS reads CanvOS/k8s_version.json when K8S_VERSION is empty in .arg,
# building one container image per (distribution, version) entry. When this
# dict is non-empty, the role renders it into CanvOS/k8s_version.json before
# the Earthly build, overriding upstream CanvOS's shipped file. Empty dict
# (default) leaves the upstream file untouched.
#
# Format: { distribution: [bare-version-strings] }. CanvOS itself appends
# the flavor tag (-k3s1 for k3s, -rke2r1 for rke2, etc.) — do NOT include it.
# kairos_k8s_versions: {}
#   k3s:
#     - "1.31.6"
#     - "1.32.1"
#   rke2:
#     - "1.32.1"

# ---------------------------------------------------------------------------
# Internal — typically don't override these in inventory.
# ---------------------------------------------------------------------------

# Computed path facts. The Makefile passes E2E_DIR via environment to ansible-
# playbook; these inventory entries are fallbacks for invocations that bypass
# the Makefile. Override only when running from a non-standard layout.
# e2e_dir:   "{{ playbook_dir | default('.') }}/.."
# build_dir: "{{ e2e_dir }}/build"
# dist_dir:  "{{ e2e_dir }}/dist"

# DEPRECATED. Surfaced as a suggestion by older `make discover` output but no
# longer consumed anywhere — the kairos-installer kernel version is detected
# at deploy-dd time via `ls /cm/images/<profile>-installer/boot/vmlinuz-*` on
# BCM. Safe to leave unset. Kept here only because legacy inventories still
# reference it.
# kairos_kernel_version: "6.8.0-87-generic"
