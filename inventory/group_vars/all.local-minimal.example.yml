# ===========================================================================
# MINIMAL viable group_vars for a local-KVM deployment (make all / stages 1-6).
#
# Every variable below has NO default in any role — the run fails without it.
# Everything omitted relies on a working default:
#   bcm_ssh_host           -> localhost
#   bcm_ssh_proxy_jump     -> none (direct)
#   bcm_source_category    -> default
#   bcm_target_node        -> unset => deploy-dd auto-registers node001
#   bcm_manage_dns         -> false
#   bcm_manage_cluster_defaults -> false
#   kairos_wipe_disks      -> "" (single-disk VM)
#   kairos_profile         -> default-kairos
#   kairos_canvos_args     -> {}    (upstream CanvOS .arg)
#   kairos_extra_apt_packages -> []
#   kairos_user_data       -> ""
#   kairos_build_raw_disk  -> true  (day-1 ISO + raw disk)
#   palette_project_name / installation_mode / management_mode / ca_cert / token
#                          -> omitted (SaaS-style; uses projectUid + stylus defaults)
#
# Copy to inventory/group_vars/all.yml and fill the secrets.
# ===========================================================================

# --- BCM connection (localhost defaults apply; only the ports are required) ---
bcm_password:        "HelloRubyTuesday"
bcm_ssh_port:        2222          # host port forwarded to BCM:22
bcm_https_port:      10443         # host port forwarded to BCM:443

# --- BCM provisioning network ---
bcm_internal_ip:      "192.168.98.2"
bcm_internal_cidr:    "192.168.98.0/24"
bcm_internal_netmask: "24"

# --- BCM VM identity + sizing (stages 1-2) ---
bcm_hostname:         "bcm11-headnode"
bcm_timezone:         "America/Los_Angeles"
bcm_external_gateway: "10.0.2.2"
bcm_external_dns:     "1.1.1.1"
bcm_vm_ram:           8192
bcm_vm_cpus:          4
bcm_vm_disk_size:     "100G"

# --- JFrog: BCM ISO download (stage 1) ---
jfrog_token:    "REPLACE_WITH_JFROG_TOKEN"
jfrog_instance: "insightsoftmax.jfrog.io"
jfrog_repo:     "iso-releases"
iso_filename:   "bcm-11.0-ubuntu2404.iso"

# --- Kairos compute VM (stage 5) ---
kairos_vm_mac:       "52:54:00:00:02:01"   # required: stage-5 QEMU NIC + node001 registration must match
kairos_vm_ram:       4096
kairos_vm_cpus:      2
kairos_vm_disk_size: "80G"
kairos_target_disk:  "/dev/vda"            # the dd target disk inside the VM

# --- Palette (baked into the image at build time, stage 3) ---
palette_endpoint:    "palette.isc-spectro-dev.click"
palette_project_uid: "69d6c1308390e83a5e40405c"
palette_api_key:     "REPLACE_WITH_PALETTE_API_KEY"
