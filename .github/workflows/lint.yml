---
name: lint

# Static quality gates. Runs the SAME `make` targets with the SAME pinned tool
# versions as a local checkout, so a green `make lint && make analyze && make
# fmt-check` locally predicts a green CI (and vice-versa). No third-party
# lint/secret actions — they drift from the CLIs developers actually run.
# Gates are lax during rollout (plan Part C.6) and ratchet over time; gitleaks
# (inside `make analyze`) blocks from day one.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history for gitleaks (make analyze)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools (pinned, matching local)
        run: |
          set -euxo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          pip install --quiet ansible ansible-lint yamllint checkov bandit vulture
          curl -fsSL -o /usr/local/bin/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64
          sudo chmod +x /usr/local/bin/shfmt
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
          shellcheck --version; shfmt --version; gitleaks version

      - name: make fmt-check
        run: make fmt-check

      - name: make lint
        run: make lint

      - name: make analyze
        run: make analyze

  # Behaviour guards. Run on the PR *merged into current main* (the default
  # pull_request checkout), so a merge that git resolved without a conflict but
  # that changes a profile, duplicates a block, or breaks a template is caught
  # here rather than on a node. See CONTRIBUTING.md, "What CI guards and why".
  regression-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools (pinned; the goldens are rendered with this ansible-core)
        run: |
          set -euxo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          pip install --quiet "ansible-core==2.20.2" pyyaml pytest
          ansible --version | head -1; shellcheck --version | sed -n 2p

      - name: make guards (merge leftovers, duplicate tasks, safe defaults, secrets ignores)
        run: make guards

      - name: make render-check (every profile renders, validates, and matches tests/golden/)
        run: make render-check

      - name: make test (unit tests for the repo's scripts)
        run: make test
