[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_paths = ~/.ansible/collections
host_key_checking = false
retry_files_enabled = false
inject_facts_as_vars = false
stdout_callback = default
result_format = yaml

# ---- Logging / observability (see plan Part D) ----
# Default structured run log. The Makefile overrides ANSIBLE_LOG_PATH per run
# into a timestamped logs/run-<ts>/ dir; this default catches ad-hoc runs.
log_path = logs/ansible.log
# Per-task timing — prints a slowest-tasks summary at the end of every run, so a
# hung/slow step is obvious (the #1 thing the old logs couldn't tell you).
callbacks_enabled = ansible.posix.profile_tasks
# Failed-task stderr goes straight to the console instead of being buried in the
# result object — the actual error is the first thing you see.
display_failed_stderr = true
# Keep task args OUT of stdout so secrets in module args aren't echoed into logs
# (no_log still governs sensitive tasks; this is defense in depth).
display_args_to_stdout = false

[privilege_escalation]
become = true
become_method = sudo

[ssh_connection]
pipelining = true
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
